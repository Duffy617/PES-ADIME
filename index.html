<title>營養照護流程紀錄練習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Single light theme by request: white ground, sans (黑體) throughout.
   Layout: clinical chart workbench — sticky tab rail, single reading column, PES colour-coded P/E/S throughout */
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --ink:#14201D; --muted:#56655F; --line:#D5DFDB; --soft:#E8EFEC;
  --accent:#0E6655; --accent-ink:#FFFFFF;
  --p:#0E6655; --p-bg:#E2F1EC; --e:#8A5208; --e-bg:#F8EEDC; --s:#34449E; --s-bg:#E7EAF8;
  --ok:#1D6E41; --ok-bg:#E2F2E8; --warn:#8C4A0B; --warn-bg:#FBEBD6; --err:#A42A21; --err-bg:#FBE3E0;
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:18px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{height:56px;width:auto;flex:none}
.brand h1 .sub{font-size:.62em;font-weight:500;color:var(--muted);white-space:nowrap}
.brand .lab{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--muted)}
@media (max-width:640px){.brand .logo{height:40px}.brand .lab{font-size:.72rem}}
.brand h1{font-family:var(--display);font-size:1.5rem;margin:0;text-wrap:balance}
.brand .ver{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:12px 14px;color:var(--muted);text-decoration:none;font-size:.95rem;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:28px 64px;display:grid;gap:28px}
section.view{display:grid;gap:24px}
h2{font-family:var(--display);font-size:1.45rem;margin:0;text-wrap:balance}
h3{font-size:1.1rem;margin:0;font-weight:700;text-wrap:balance}
h4{font-size:1rem;margin:0;font-weight:700}
p{margin:0}
.lede{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;counter-reset:st}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.step b{font-family:var(--mono);font-size:.8rem;color:var(--accent);letter-spacing:.04em}
ul,ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
li{max-width:none}
.cite{display:inline-block;font-family:var(--mono);font-size:.72rem;line-height:1.4;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--muted);text-decoration:none;white-space:nowrap;vertical-align:1px;margin-left:2px}
.cite:hover{color:var(--ink)}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;font-weight:500;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)} .t-err{background:var(--err-bg);color:var(--err)} .t-muted{background:var(--soft);color:var(--muted)}
.note{border-left:4px solid var(--warn);background:var(--warn-bg);padding:12px 16px;border-radius:0;display:grid;gap:6px}
.note.teach{border-left-color:var(--accent);background:var(--p-bg)}
.note.err{border-left-color:var(--err);background:var(--err-bg)}
.note p,.note li{color:var(--ink)}
.pes{display:grid;gap:8px}
.pes .row{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.pes .k{font-family:var(--mono);font-weight:500;text-align:center;border-radius:6px;padding:4px 0}
.k-p{background:var(--p-bg);color:var(--p)} .k-e{background:var(--e-bg);color:var(--e)} .k-s{background:var(--s-bg);color:var(--s)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);background:var(--soft);font-size:.82rem;letter-spacing:.02em}
tr:last-child td{border-bottom:0}
td.code,.mono{font-family:var(--mono);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
label{font-size:.9rem;font-weight:500;display:grid;gap:6px}
textarea,select,input[type=text]{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:72px}
.btn{font:inherit;font-size:.92rem;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.small{padding:4px 10px;font-size:.82rem}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pesbox{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;background:var(--surface)}
.pesbox .lab-p{color:var(--p)} .pesbox .lab-e{color:var(--e)} .pesbox .lab-s{color:var(--s)}
.checks{display:grid;gap:6px;font-size:.9rem}
.chk{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.linkrow{display:grid;grid-template-columns:1fr 170px auto;gap:8px;align-items:start}
.linkrow.me5{grid-template-columns:1fr 1fr 120px auto}
@media (max-width:640px){.linkrow,.linkrow.me5{grid-template-columns:1fr}}
fieldset legend{font-size:.85rem}
.out.note{white-space:normal;display:grid;gap:14px;font-size:.93rem}
.note .nsec h5{margin:0 0 6px;font-size:.98rem;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
.note p{margin:2px 0}.note .nl{font-weight:600}
.note ol{margin:2px 0 4px;padding-left:1.6em}.note ol ol{margin:2px 0}.note li{margin:1px 0}
.note .ni{padding-left:1.2em}.note .nl2{font-weight:500}
.note .npes{margin:6px 0 10px}.note .npes table{border-collapse:collapse;margin:4px 0}
.note .npes th{text-align:left;font-family:var(--mono);font-weight:600;padding:2px 12px 2px 0;vertical-align:top;white-space:nowrap}
.note .npes td{padding:2px 0;background:none;border:0}.note .npes th{background:none;border:0;color:var(--ink)}.note .npes table{width:auto}.out.note li{line-height:1.6;margin:0;padding:0}.out.note ol{margin:0 0 4px}
.note .ntbl{border-collapse:collapse;width:100%;margin:2px 0}
.note .ntbl th,.note .ntbl td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.note .ntbl th{background:var(--surface);font-weight:600}
.note .ntbl td:first-child,.note .ntbl th:first-child{width:2.2em;text-align:center;color:var(--muted)}
.out{white-space:pre-wrap;font-family:var(--body);font-size:.92rem;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;min-height:120px;overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.88rem;padding:6px 14px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.casebar{display:flex;flex-wrap:wrap;gap:8px}
.casebar button{font:inherit;font-size:.92rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.casebar button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.calc{display:grid;gap:8px}
.calc .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.calc .line:last-child{border-bottom:0}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details>summary{cursor:pointer;padding:14px 18px;font-weight:500;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--accent)}
details[open]>summary::before{content:"▾ "}
details>.inner{padding:0 18px 18px;display:grid;gap:14px}
.tips{display:grid;gap:14px}
.tip{display:grid;gap:4px}
.tip>b::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:10px;vertical-align:middle;position:relative;top:-2px}
.tip>p,.tip>ul{padding-left:1.4em}
.tip ul{gap:4px}
.termtree{display:grid;gap:14px}
.dmgroup{display:grid;gap:6px}
tr.subh td{background:#f6f6f6}
details.rsd>summary{cursor:pointer;list-style:none}details.rsd>summary::-webkit-details-marker{display:none}
details.rsd>summary::before{content:"▸ ";color:var(--accent)}details.rsd[open]>summary::before{content:"▾ "}
.rsbox{margin:8px 0 4px;padding:10px 12px;border-left:3px solid var(--line);background:var(--soft);font-size:.92rem}
.rsbox h6{margin:10px 0 4px;font-size:.92rem;font-weight:700}.rsbox ul{margin:2px 0 4px;padding-left:1.3em}.rsbox p{margin:2px 0}.rsbox .nl2{font-weight:600;margin-top:6px}
details.cls .sub{display:grid;gap:8px;margin:0 14px 14px}
details.cls .sub>details.cls .tbl{margin:0 10px 10px}
.dmgroup h5{margin:0;font-size:.98rem;font-weight:700}
details.cls>summary{padding:10px 14px;font-weight:500}
details.cls .tbl{margin:0 14px 14px}
details.ehelp{font-size:.9rem}
details.ehelp>summary{padding:8px 12px;font-weight:500;color:var(--e)}
details.ehelp .inner{padding:0 12px 12px}
.srccard{display:grid;gap:6px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);scroll-margin-top:70px}
.srccard.hl{box-shadow:0 0 0 2px var(--accent)}
.srccard,.srccard>*{min-width:0}
.srccard a,.srccard .meta,.srccard h4{overflow-wrap:anywhere;word-break:break-word}
.srcid{font-family:var(--mono);font-weight:500;color:var(--accent)}
.meta{font-size:.85rem;color:var(--muted)}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.srccard{transition:box-shadow .3s}}
</style>

 <div><h2>NCP 總覽</h2><p class="lede">營養照護流程（Nutrition Care Process, NCP）是思考流程；ADIME 與 SOAP 是把結果寫進病歷的格式。四個步驟的寫法分別見 A、D、I、M&amp;E 四個分頁。</p></div>
 <div class="panel"><h3>NCP 四步驟分成兩個階段</h3>
  <p>ADIME 是把 NCP 四個步驟寫進病歷的紀錄格式，A、D、I、M&amp;E 分別對應下表四個步驟。</p>
  <div class="tbl"><table><thead><tr><th>階段</th><th>步驟</th><th>做什麼</th></tr></thead><tbody>
   <tr><td rowspan="2">找出問題<br><span class="meta">Problem identification</span></td><td>1 營養評估（A）<br><span class="meta">Nutrition assessment</span></td><td>有系統地收集、分類、整合資料（指標，indicators），找出營養相關問題及其原因；將資料與比較標準（Comparative standards）進行比較 ${c("S8","Assessment")}</td></tr>
   <tr><td>2 營養診斷（D）<br><span class="meta">Nutrition diagnosis</span></td><td>辨識並命名營養師負責處理的現存營養問題，以 PES 敘述 ${c("S8","Diagnosis")}</td></tr>
   <tr><td rowspan="2">解決問題<br><span class="meta">Problem solving</span></td><td>3 營養介入（I）<br><span class="meta">Nutrition intervention</span></td><td>為了解決或改善營養診斷而刻意計畫的行動，通常針對病因 ${c("S8","Intervention")}</td></tr>
   <tr><td>4 營養監測與評值（M&amp;E）<br><span class="meta">Nutrition monitoring and evaluation</span></td><td>選定與診斷及介入目標相關的指標，判斷進展與目標是否達成 ${c("S8","M&E")}</td></tr>
  </tbody></table></div>
  <p class="meta">兩階段的分法見 ${c("S9","p.2003")}。</p></div>
 <div class="panel"><h3>SOAP 各段內容</h3>
  <div class="tbl"><table><thead><tr><th>段落</th><th>內容</th></tr></thead><tbody>
   <tr><td class="code">S<br><span class="meta">主觀資料<br>Subjective</span></td><td>病人或照顧者提供的資訊：主訴、病史、症狀（病人自述）</td></tr>
   <tr><td class="code">O<br><span class="meta">客觀資料<br>Objective</span></td><td>就診時取得的客觀資料：生命徵象、身體檢查、檢驗、影像；觀察到的徵象放這裡</td></tr>
   <tr><td class="code">A<br><span class="meta">評估<br>Assessment</span></td><td>整合 S 與 O，列出依優先順序排列的問題</td></tr>
   <tr><td class="code">P<br><span class="meta">計畫<br>Plan</span></td><td>針對每個問題的下一步：檢查、治療、轉介、衛教與諮詢</td></tr>
  </tbody></table></div>
  <p class="meta">依 StatPearls〈SOAP Notes〉整理 ${c("S6")}。這是一般醫療寫法，非營養專用。</p></div>
 <div class="panel"><h3>ADIME 與 SOAP 的對應</h3>
  <div class="tbl"><table><thead><tr><th>ADIME</th><th>放進 SOAP 的位置</th></tr></thead><tbody>
   <tr><td>營養評估（A，Assessment）：病人陳述的飲食史、症狀</td><td class="code">S</td></tr>
   <tr><td>營養評估（A，Assessment）：體位、生化、身體檢查</td><td class="code">O</td></tr>
   <tr><td>營養診斷（D，Diagnosis）：PES，依優先順序</td><td class="code">A</td></tr>
   <tr><td>營養介入（I，Intervention）、營養監測與評值（M&amp;E，Monitoring and Evaluation）</td><td class="code">P</td></tr>
  </tbody></table></div>
  <p class="meta">依 ${c("S6")} 的 SOAP 定義與 NCP 四步驟整理。</p></div>
 <div class="panel"><h3>官方示範：一條完整的 ADIME 照護鏈（長照機構）</h3>
  <div class="pes">
   <div class="row"><span class="k">A</span><div>食物攝取：據報告進食量少於餐點 50%，進食量隨一天推移而減少，伴隨疲倦與吞嚥困難徵象增加<br>體重減輕：過去 1 個月減 7 lb（3.2 kg）（體重減輕 5%）<br>實測體重：148 lb（67 kg）<br>營養相關身體檢查發現：輕度至中度肌肉流失<br>飲食：細碎濕軟（Minced and moist）<br>比較標準：24 小時估計總熱量需求 1,500 kcal（6,300 kJ）；24 小時估計總蛋白質需求 80 g/日<br>總熱量需求估算方法：22 kcal/kg、1.2 g 蛋白質/kg</div></div>
   <div class="row"><span class="k k-p">P</span><div>營養不良（Malnutrition）</div></div>
   <div class="row"><span class="k k-e">E</span><div>經口攝取不足（Inadequate oral intake）</div></div>
   <div class="row"><span class="k k-s">S</span><div>住民進食量少於餐點 50%、體重減輕 5%、有肌肉耗損（主觀整體評估 Subjective global assessment, SGA：B 級）、自述疲倦與吞嚥困難</div></div>
   <div class="row"><span class="k">I</span><div>營養處方：1,500 kcal、蛋白質 80 g/日、泥狀飲食；正餐與點心：泥狀食物第 4 級（綠）、中度稠液體第 3 級（黃）<br>食物與營養素供給：飲食醫囑改為泥狀，加入強化食品與餐間點心；實施發藥時一併發放營養補充品的計畫（Medication nutrition supplement pass program）<br>與其他醫療人員合作：請護理人員監測對泥狀飲食的耐受情形</div></div>
   <div class="row"><span class="k">M&amp;E</span><div>護理人員觀察用餐，回報住民能耐受也接受這份飲食；市售包裝飲料喝完 95%；體重增加 3%。<br>指標（Indicator）：餐點、點心與飲料的進食百分比<br>判斷標準（Criterion）：至少 95%<br>指標（Indicator）：體重增加<br>判斷標準（Criterion）：體重增加 3%</div></div>
  </div>
  <p class="meta">中文轉述自 ${c("S10","Fig 3, pp.843–845")}，PES 部分 Academy 標註為「僅供示範」。</p></div>
 <div class="panel"><h3>NCP 的沿革</h3>
  <div class="tbl"><table><tbody>
   <tr><td class="mono">1970–1986</td><td>Penn State 的 Hammond 模型（1970、1977、1984、1986 四版），被視為 NCPM 圖示的早期雛形之一 ${c("S11","pp.1879–1885")}</td></tr>
   <tr><td class="mono">2003</td><td>Academy（當時為 American Dietetic Association）採用營養照護流程與模型（Nutrition Care Process and Model, NCPM） ${c("S11","p.1879")}</td></tr>
   <tr><td class="mono">2008</td><td>營養照護流程與模型更新版 ${c("S11","Fig 8, p.1889")}</td></tr>
   <tr><td class="mono">2017</td><td>更新版強調以人為中心與成果管理，並新增「營養處方（Nutrition prescription）」作為介入的明確步驟 ${c("S9","p.2003; p.2009")}</td></tr>
   <tr><td class="mono">2017 前</td><td>營養不良（Malnutrition）由攝取量領域（Intake）移至臨床面領域（Clinical），2017 年文章列為近期變更 ${c("S9","p.2012")} ${c("S10","p.848")}</td></tr>
  </tbody></table></div></div>
 </section>`}

function vAssess(){return `<section class="view">
 <div><h2>營養評估（A）<span class="meta" style="font-weight:400">　Nutrition assessment</span></h2><p class="lede">有系統地收集、分類、整合重要的資料（指標，indicators），找出營養相關問題及其原因 ${c("S8","Assessment")}。</p></div>
 <div class="panel"><h3>營養評估（A）的資料與比較標準</h3>
  <ul>
   <li>個人的資料可直接來自病人：會談、觀察與測量；也可來自病歷與轉介的醫療人員。族群則使用調查、行政資料與流行病學或研究資料 ${c("S8","Assessment")}。</li>
   <li>收集到的數字本身看不出好壞，要拿一個「標準」來比，才知道是太多、太少還是剛好。這個標準就叫比較標準（Comparative standards），可以是國家的建議量、機構或法規訂的標準，或是為這位病人設定的目標 ${c("S8","Assessment")}。</li>
  </ul></div>
 <div class="panel" id="aterms-panel"><h3>營養評估（A）標準術語</h3>
  <ul>
   <li>營養評估（A）每一項的標題，都應盡量從 2023 版營養評估與監測評值術語（Nutrition Assessment and Monitoring and Evaluation Terminology）中選擇，共 1,479 個 ${c("S12")}。</li>
   <li>先判斷資料屬於哪個領域（攝取、體位、生化、身體檢查、病史），再到該類別裡尋找。</li>
  </ul>
  <p class="meta">表中中文為本平台的教學譯名（S12 沒有官方中譯），用字以英文原文為準。</p>
  <details id="atermsbox"><summary>展開營養評估術語表（A）</summary><div class="inner">
<div class="btnrow" style="justify-content:space-between"><h4>依 9 個領域展開</h4><label style="display:flex;align-items:center;gap:8px;font-weight:400">搜尋<input type="text" id="atq" value="${esc(atQ)}" placeholder="英文、中文或代碼" style="width:220px"></label></div>
  <div id="atbody" class="termtree"></div>
  </div></details></div>
 <div class="panel" id="how-a"><h3>營養評估（A）怎麼寫</h3>
  <ol>
   <li><b>用標準術語當項目名稱：</b>能對應到標準術語的資料，就用術語當標題，後面接具體數值或描述。這是官方範例的寫法，不是硬性規定：同一張圖中也有項目沒有用術語（如公共衛生例的 Hgb），或直接用敘述句寫（如非急性照護例）${c("S10","Fig 3, p.843")}。</li>
   <li><b>區分「實測」與「自述」：</b>2023 版術語把實測（Measured）與自述（Stated）分成不同的項目，例如實測體重與自述體重 ${c("S12","p.9")}。</li>
   <li><b>寫出比較標準：</b>要寫比較標準（CS），例如估計熱量需求，後面營養診斷（D）的 S 才有比較依據，例如「攝取超過需求 700 kcal/日」${c("S10","Fig 3, p.844")}。</li>
   <li><b>代碼不寫進紀錄：</b>NCPT 代碼與 ANDUID 都不寫進營養紀錄；ANDUID 用於電子病歷的資料追蹤 ${c("S12","p.1")}。</li>
  </ol>
 </div>
 <div class="panel" id="write-a"><h3>營養評估（A）官方範例（Academy） ${c("S10","Fig 3, p.843")} ${c("S12")}</h3>
  <p>營養評估（A）多半寫成「<b>標準術語：數值或描述</b>」，最後列出<b>比較標準</b>。</p>
  <details class="cls"><summary>例 1：長照機構，住民進食量減少、有吞嚥困難</summary>
  <div class="tbl"><table><thead><tr><th>項目（2023 術語）</th><th class="mono">代碼</th><th>範例內容</th><th></th></tr></thead><tbody>
   <tr><td>24 小時估計進食餐點百分比<br><span class="meta">Estimated percent of meals eaten in 24 hours</span></td><td class="code">FH-1.2.2.1.1.8</td><td>據報告進食量少於餐點 50%；進食量隨一天推移而減少，伴隨疲倦與吞嚥困難徵象增加</td><td>${c("S12","p.2")}</td></tr>
   <tr><td>體重減輕<br><span class="meta">Body weight loss</span></td><td class="code">AD-1.1.4.2</td><td>過去 1 個月減 3.2 kg（5%）</td><td>${c("S12","p.9")}</td></tr>
   <tr><td>實測體重<br><span class="meta">Measured body weight</span></td><td class="code">AD-1.1.2.1</td><td>67 kg</td><td>${c("S12","p.9")}</td></tr>
   <tr><td>肌肉相關發現<br><span class="meta">Muscle finding</span></td><td class="code">PD-1.1.14</td><td>輕度至中度肌肉流失</td><td>${c("S12","p.14")}</td></tr>
   <tr><td>飲食醫囑（調整型）<br><span class="meta">Modified diet order</span></td><td class="code">FH-2.1.1.2</td><td>細碎濕軟（Minced and moist）</td><td>${c("S12","p.6")}</td></tr>
   <tr class="subh"><td colspan="4"><b>比較標準（Comparative standards）</b></td></tr>
   <tr><td>24 小時估計熱量需求<br><span class="meta">Total energy estimated needs in 24 hours</span></td><td class="code">CS-1.1.1</td><td>1,500 kcal</td><td>${c("S12","p.17")}</td></tr>
   <tr><td>24 小時估計蛋白質需求<br><span class="meta">Total protein estimated needs in 24 hours</span></td><td class="code">CS-2.2.1</td><td>80 g</td><td>${c("S12","p.17")}</td></tr>
   <tr><td>需求估算方法<br><span class="meta">Method for estimating 24 hour energy needs</span></td><td class="code">CS-1.1.2</td><td>22 kcal/kg、1.2 g 蛋白質/kg（原圖將兩者都列在熱量需求估算方法下）</td><td>${c("S12","p.17")}</td></tr>
  </tbody></table></div>
  </details>
  <details class="cls"><summary>例 2：急性照護，病人主訴不希望的體重增加</summary>
  <div class="tbl"><table><thead><tr><th>項目（2023 術語）</th><th class="mono">代碼</th><th>範例內容</th><th></th></tr></thead><tbody>
   <tr><td>24 小時估計熱量攝取量<br><span class="meta">Total energy estimated intake in 24 hours</span></td><td class="code">FH-1.1.1.1.1</td><td>&gt; 2,200 kcal/日</td><td>${c("S12","p.1")}</td></tr>
   <tr><td>年齡<br><span class="meta">Age</span></td><td class="code">CH-1.1.1</td><td>45 歲</td><td>${c("S12","p.16")}</td></tr>
   <tr><td>自述身高<br><span class="meta">Stated body height</span></td><td class="code">AD-1.1.1.7</td><td>163 cm</td><td>${c("S12","p.9")}</td></tr>
   <tr><td>自述體重<br><span class="meta">Stated body weight</span></td><td class="code">AD-1.1.2.2</td><td>86 kg</td><td>${c("S12","p.9")}</td></tr>
   <tr><td>身體質量指數<br><span class="meta">Body mass index (BMI)</span></td><td class="code">AD-1.1.5.1</td><td>32.4（肥胖）</td><td>${c("S12","p.9")}</td></tr>
   <tr><td>估計正餐與點心型態<br><span class="meta">Estimated meal and snack pattern</span></td><td class="code">FH-1.2.2.3.1</td><td>不餓時也吃東西</td><td>${c("S12","p.2")}</td></tr>
   <tr><td>食物種類<br><span class="meta">Types of food</span></td><td class="code">FH-1.2.2.2</td><td>常吃高脂食物</td><td>${c("S12","p.2")}</td></tr>
   <tr><td>體重增加<br><span class="meta">Body weight gain</span></td><td class="code">AD-1.1.4.1</td><td>24 個月增加 27 kg</td><td>${c("S12","p.9")}</td></tr>
   <tr><td>改變行為的準備度：考慮期<br><span class="meta">Contemplation stage for readiness to change</span></td><td class="code">FH-4.3.9.8.2</td><td>考慮期，對自身健康表示擔憂</td><td>${c("S12","p.7")}</td></tr>
   <tr class="subh"><td colspan="4"><b>比較標準（Comparative standards）</b></td></tr>
   <tr><td>24 小時估計熱量需求<br><span class="meta">Total energy estimated needs in 24 hours</span></td><td class="code">CS-1.1.1</td><td>1,500 kcal</td><td>${c("S12","p.17")}</td></tr>
   <tr><td>需求估算方法<br><span class="meta">Method for estimating 24 hour energy needs</span></td><td class="code">CS-1.1.2</td><td>Mifflin-St Jeor 公式</td><td>${c("S12","p.17")}</td></tr>
  </tbody></table></div>
  </details>
 </div>
 </section>`}

function vPes(){return `<section class="view">
 <div><h2>營養診斷（D）<span class="meta" style="font-weight:400">　Nutrition diagnosis</span><br><span style="font-size:.85em">PES 寫作規則</span></h2><p class="lede">句型為「P related to E as evidenced by S」${c("S8","Diagnosis")}。P 是營養問題（Problem），E 是病因（Etiology），S 是徵象與症狀（Signs/symptoms）。</p></div>
 <div class="panel pes">
  <div class="row"><span class="k k-p">P</span><div><b>營養問題（Problem）</b><br>描述病人營養狀態的改變，或造成改變的因素，必須使用標準化營養診斷術語（見下方術語表）${c("S8","Diagnosis")}。分為攝取量（Intake）、臨床面（Clinical）、行為-環境（Behavioral-environmental）、營養情境（Nutrition situation）四個領域 ${c("S8","Diagnosis")}。</div></div>
  <div class="row"><span class="k k-e">E</span><div><b>病因（Etiology）</b><br>造成問題的原因或危險因子，以「related to」連接 P ${c("S8","Diagnosis")}。應是營養師能介入改善的根本原因；實驗室數值不屬於 E，應放在 S ${c("S2")}。</div></div>
  <div class="row"><span class="k k-s">S</span><div><b>徵象與症狀（Signs/symptoms）</b><br>用來判定診斷的資料或指標，以「as evidenced by」連接 E ${c("S8","Diagnosis")}。選擇能顯示問題解決或改善的徵象 ${c("S9","p.2009")}。</div></div>
 </div>
 <div class="panel" id="terms-panel"><h3>營養問題（P）</h3>
  <ul>
   <li>P 必須從 2023 版營養診斷術語（Nutrition Diagnostic Terminology）的 178 個術語中選擇，不能自己描述 ${c("S13")}；中文名稱依全聯會中譯本 ${c("S14")}。</li>
   <li>點開診斷名稱，可看到定義、病因與可能的指標，寫 E 與 S 時可以對照 ${c("S16")}。</li>
  </ul>
  <details id="termsbox"><summary>展開營養診斷術語表（P）</summary><div class="inner">
<div class="btnrow" style="justify-content:space-between"><h4>2023 版全部 178 個營養診斷術語</h4><label style="display:flex;align-items:center;gap:8px;font-weight:400">搜尋<input type="text" id="termq" value="${esc(termQ)}" placeholder="英文、中文或代碼" style="width:220px"></label></div>
  <div id="termbody" class="termtree">${termRows()}</div>
 <div class="note"><p><b>代碼不寫進病歷。</b>術語表說明 NCPT 代碼與 ANDUID 識別碼都不應寫入營養紀錄 ${c("S13","p.1")}。代碼只用來查找與定位術語。</p></div>
  </div></details></div>
 <div class="panel" id="write-e"><h3>病因（E）</h3>
  <ul><li>造成這個營養問題的根本原因，而且是營養師能介入改善的；實驗室數值不屬於 E，要放在 S ${c("S2")} ${c("S8","Diagnosis")}。</li></ul>
  <details class="cls"><summary>病因（E）怎麼寫</summary>
  <ul style="margin:0 14px 14px 30px">
   <li><b>找根本原因：</b>問自己「是什麼阻礙了這個問題被解決、為什麼會發生」，答案要是營養師能著手改善的 ${c("S2","講稿")}。</li>
   <li><b>寫營養師能處理的那一層，不寫疾病或治療本身</b> ${c("S2","講稿")}</li>
   <li><b>根據評估中可靠、正確的資料：</b>E 要有評估資料支持，不是猜測 ${c("S2","講稿")}。</li>
   <li><b>實驗室數值不是 E：</b>例如「糖化血色素 8.5%」是證據，要放在 S ${c("S2","slide 12 與講稿")}。</li>
   <li><b>檢查：</b>這個 E 能用營養介入處理嗎？如果處理 E 仍無法解決問題，營養介入至少能減輕 S 嗎 ${c("S8","Diagnosis")}？</li>
   <li><b>找靈感：</b>在上方術語表點開診斷名稱，可看到該診斷參考表列出的常見病因 ${c("S16")}。</li>
  </ul>
  </details>
  <h4>病因類別（Etiology category）</h4>
  <ul><li>寫完 E 後，判斷它屬於 10 類病因中的哪一類 ${c("S8","Diagnosis")}。</li></ul>
  <details class="cls"><summary>展開 10 類病因</summary>
  <div class="tbl"><table><thead><tr><th>類別</th><th>代碼</th><th>教學譯名</th></tr></thead><tbody>
   ${EY.map(r=>`<tr><td>${r[0]}</td><td class="code">${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
  </tbody></table></div>
  </details>
  <p class="meta">名稱與代碼見 ${c("S12","p.17")}。術語表只列名稱，沒有各類別的定義；中文為本平台教學譯名。</p>
  <ul>
   <li>決定介入方式的主要是病因，例如知識類病因通常以營養教育介入 ${c("S10","p.853")}。</li>
   <li>文獻沒有「病因類別對應介入」的對照表，上例是教學說明 ${c("S10","p.853")}。</li>
  </ul>
 </div>
 <div class="panel" id="write-s"><h3>徵象與症狀（S）</h3>
  <ul><li>營養評估中收集到的主、客觀資料，用來證明營養問題存在並描述其嚴重程度 ${c("S8","Diagnosis")} ${c("S16")}。</li></ul>
  <details class="cls"><summary>徵象與症狀（S）怎麼寫</summary>
  <ul style="margin:0 14px 14px 30px">
   <li><b>來自營養評估資料：</b>S 是問題的證據，要能在營養評估（A）的資料中找到 ${c("S2","講稿")}；整體來說，評估資料要能支持 P、E、S ${c("S8","Diagnosis")}。</li>
   <li><b>盡量客觀、可量測：</b>之後要靠 S 追蹤問題有沒有改善，所以盡量寫可量測的資料 ${c("S2","講稿")}；S 要具體到可以監測變化 ${c("S8","Diagnosis")}。</li>
   <li><b>選會因營養介入而改變的資料：</b>要能顯示介入的成效 ${c("S2","講稿")}。常見的有體重史、經口攝取百分比、檢驗值 ${c("S2","講稿")}。</li>
   <li><b>病人自述也可以：</b>S 包含主觀與客觀資料 ${c("S16")}。官方正確範例就用了「自述沒有食慾」「自述用餐時嗆咳」「自述每天一餐」 ${c("S2","slides 9–11")}。自述要寫具體，例如「自述每天只吃一餐」，下次回診才能比較。</li>
   <li><b>對照參考表的指標：</b>在上方術語表點開診斷名稱，可看到「此營養診斷可能的指標」，依生化、體位、身體檢查、飲食史、個案史分類；參考表標示至少要出現 1 項 ${c("S16")}。</li>
  </ul>
  </details>
  <p class="meta">範例：COPD 病人的 S 寫「1 個月內攝取不到估計需求 75%；1 個月體重減 6 lb（5%）；自述沒有食慾」，同時有攝取量、體重變化與自述 ${c("S2","slide 9")}。</p>
 </div>
 <div class="panel" id="e-vs-s"><h3>病因（E）與徵象與症狀（S）怎麼區分</h3>
  <div class="tbl"><table><thead><tr><th></th><th>病因（E）</th><th>徵象與症狀（S）</th></tr></thead><tbody>
   <tr><td>回答的問題</td><td>問題<b>為什麼</b>會發生</td><td><b>怎麼知道</b>問題存在</td></tr>
   <tr><td>Snapshot 的定義</td><td>原因／促成的危險因子（Cause/Contributing risk factors），以 related to 連接 P</td><td>用來判定營養診斷的資料或指標（Data or indicators），以 as evidenced by 連接 E</td></tr>
   <tr><td>寫什麼</td><td>營養師能處理的根本原因，例如知識不足、行為、取得食物的限制、攝食能力下降</td><td>評估資料中的證據，例如體重變化、經口攝取百分比、檢驗值、病人自述</td></tr>
   <tr><td>之後怎麼用</td><td>決定營養介入的方向</td><td>營養監測與評值（M&amp;E）時追蹤的指標</td></tr>
  </tbody></table></div>
  <p class="meta">依 ${c("S8","Diagnosis")}、${c("S2","講稿")}、${c("S10","p.853")} 整理。</p>
 </div>
 <div class="panel"><h3>有多組 PES 時：決定順序的邏輯</h3>
  <ol>
   <li><b>先確認有沒有營養問題。</b>評估後若沒有需要介入的營養問題，寫「目前沒有營養診斷」（No nutrition diagnosis at this time）${c("S8","Diagnosis")} ${c("S3")}。</li>
   <li><b>每個問題各寫一組 PES。</b>一次只陳述一個問題，清楚而單一 ${c("S8","Diagnosis")}。</li>
   <li><b>選擇營養師有責任處理或管理的營養問題。</b>P 應是能透過營養介入改善或管理的營養問題，而非單純描述醫學診斷或營養師無法處理的疾病本身 ${c("S8","Diagnosis")} ${c("S7")}。</li>
   <li><b>同一個問題、不同領域的寫法擇一時，條件相同可優先考慮攝取量（Intake）診斷。</b>Snapshot 指出攝取量診斷較能反映營養師的專業角色 ${c("S8","Diagnosis")}。</li>
   <li><b>依嚴重度（Severity）、病人價值（Client values）與安全（Safety）排出優先順序。</b>這是決定先介入哪個診斷的依據 ${c("S9","p.2009")}。</li>
  </ol>
  <p class="meta">依 ${c("S3")}、${c("S8")}、${c("S9")} 整理。決定介入先後的原則見「營養介入（I）」。</p>
 </div>

function vInterv(){return `<section class="view">
 <div><h2>營養介入（I）<span class="meta" style="font-weight:400">　Nutrition intervention</span></h2><p class="lede">為了改變營養相關行為、危險因子、環境條件或健康狀態，以解決或改善營養診斷而刻意計畫的行動 ${c("S8","Intervention")}。</p></div>
 <div class="panel"><h3>營養介入（I）的原則與步驟</h3>
  <h4>要針對病因（E）</h4>
  <ul><li>營養診斷與其病因決定介入的選擇；介入通常是改變或消除病因 ${c("S8","Intervention")} ${c("S9","p.2009")}</li>
  <li>較少數情況是減輕徵象與症狀（S），例如處理病因仍無法解決問題時 ${c("S8","Intervention; Diagnosis")}</li></ul>
  <h4>分兩步：規劃與執行</h4>
  <div>
   <div><p style="margin:8px 0 2px"><b>1. 規劃（Planning）</b></p><ul><li>依緊急性（Urgency）、影響程度（Impact）與可用資源（Available resources）排定介入優先順序 ${c("S9","p.2006, Fig 1")}</li><li>與病人合作，為每個診斷訂定介入目標；目標是之後監測進展與評估成果的依據</li><li>開立營養處方（Nutrition prescription）：依目前的參考標準與實證營養指引，配合病人的健康狀況、營養診斷與價值觀，量身訂定的建議攝取量 ${c("S15")}；2017 年的 NCP 更新版把它列為介入的明確步驟 ${c("S9","p.2009")}</li><li>選擇針對病因、且有實證的介入策略</li><li>訂定照護的時間與頻率（強度、期間、追蹤）</li></ul></div>

  </div>

 <div class="panel"><h3>營養介入的 8 個領域</h3>

 <div class="panel" id="how-i"><h3>營養介入（I）怎麼寫</h3>
  <p>依官方範例，營養介入（I）通常依序寫營養處方、介入策略、目標 ${c("S10","Fig 3, p.844")}。每一部分的寫法如下：</p>
  <details class="cls"><summary>1. 營養處方</summary>

  <p style="margin:0 14px 14px"><b>營養監測與評值：</b><br>改變營養相關行為的準備度（Readiness to change nutrition related behavior）：出院前已與體重管理營養師約診。<br>指標（Indicator）：遵從度<span class="meta">　Adherence</span><br>判斷標準（Criterion）：與體重管理營養師約診</p>

定參考標準或個人生理需求之建議量。","ety":["生理因素，如：病情進展，病人/個案可恢復全部或部分經口進食或腸道營養；因病情改變需調整給食及/或營養素的需求","對靜脈營養組成之食物與營養相關知識不足","安寧照護中的病人/或家屬沒有意願接受營養支持"],"ind":[["生化數值，醫療檢驗及流程",["↑長期(3-6週以上)營養支持個案的肝功能檢測","營養素相關的特定生化指標異常(如:使用高磷配方導致高血磷，使用低鉀配方導致低血鉀)"]],["體位測量",["體重增加大於瘦組織增生的幅度","體重流失"]],["與營養相關的身體檢查發現",["水分供應過多導致水腫","皮下脂肪及肌肉儲存減少","噁心"]],["飲食/營養相關史",["紀錄或觀察如下：","估計由靜脈輸入的醣類、蛋白質或胺基酸、脂肪或脂肪酸、維生素以及/或礦物質等持續高於或低於建議量。","估計其他營養素持續高於或低於建議量。","配方組成或型態不符合實證基礎的應用","靜脈營養輸液所開立的處方，口述或書面資料不正確或不完整","曾有靜脈營養耐受差的紀錄"]],["個案史",["沒有其他病因時，曾出現脂肪肝","有腸胃道功能問題曾被解決或改善","曾有外科大手術、創傷、燒燙傷、頭頸癌、重症病人、急性肺損傷、呼吸窘迫症候群等診斷或治療的狀況；或有需要中斷營養輸注的相關治療；或營養照護需轉院至一新的不同層級、臨終安寧照護之醫療單位"]]],"notes":[]},"NI-2.10":{"zh2016":"靜脈營養的施予與需求不一致","file":"NI","page":64,"def":"靜脈營養的供應不符合既定參考標準或個人生理需求之建議量。","ety":["生理因素，如：病情進展，個案可恢復全部或部分經口進食或腸道營養；因病情改變需調整給食的供應量","對靜脈營養供應之食物與營養相關知識不足","安寧照護中的病人/或家屬沒有意願接受營養支持"],"ind":[["生化數值，醫療檢驗及流程",["↑長期(3-6週以上)營養支持個案的肝功能檢測"]],["與營養相關的身體檢查發現",["輸注處感染","噁心"]],["飲食/營養相關史",["紀錄或觀察如下：","輸注途徑可能需要調整","輸注方式可能需要調整","PN可能影響由口進食或腸道營養","PN可能影響治療或療程","PN可能導致營養生活品質差","對PN輸注速度無法耐受","靜脈營養施予方式所開立的處方，口述或書面資料不正確或不完整","過去有PN耐受差的紀錄"]],["個案史",["沒有其他病因時，曾出現脂肪肝","有腸胃道功能問題曾被解決或改善","曾有外科大手術、創傷、燒燙傷、頭頸癌、重症病人、急性肺損傷、呼吸窘迫症候群等診斷或治療的狀況；或有需要中斷營養輸注的相關治療；或營養照護需轉院至一新的不同層級、臨終安寧照護之醫療單位"]]],"notes":[]},"NI-2.11":{"zh2016":"可接受的食物受限","file":"NI","page":69,"def":"由口進食的食物/飲品，在種類、多樣性及品質上，與參考標準值不一致。","ety":["生理因素，如：疼痛、不舒服，腸胃功能問題、發育遲緩，神經障礙等","食物/飲品在口中、咽喉或手中時感到厭惡","對食物的偏好造成多種食物/食物類別的自我限制","照顧者的問題及個案進食行為等因素導致食物供應不以營養身體為目的","不具科學證據的信念及態度"],"ind":[["體位測量",["體重下降、生長速率不足，體重若上升是因攝食某些少數種類或不理想的食物"]],["與營養相關的身體檢查發現",["具維生素/礦物質缺乏的臨床表徵","食慾不穩定"]],["飲食/營養相關史",["紀錄或觀察如下：","食物/飲品的攝取有限，其型態、種類或品質不符合參考標準","對多種食物、某些類別的食物、營養補充品或營養支持不信任"]],["個案史",["具某些診斷或治療的相關情況，如：發育障礙、感官異常、自閉症、齲齒、長期的營養支持、早產兒、神經障礙、精神狀態改變、大腦受影響的研究(MRI)等"]]],"notes":["此營養診斷可能較不適用於厭食症、暴食症、狂飲攝食異常，或其他未指明的攝食異常(EDNOS)，「攝食異常」(NB-1.5)的診斷，可考慮使用於這些狀況。"]},"NI-3.1":{"zh2016":"水分攝取不足","file":"NI","page":74,"def":"含水分的食物或其他來源攝取量，低於既定參考標準或個人生理需求之建議量。","ety":["生理因素造成，如：氣候/氣溫改變、運動增加或任何狀況導致水分需求增加；發燒所導致無感性水分流失增加；口渴敏感度下降或使用造成口渴感覺下降的藥物","水分獲取管道缺乏或受限，如：經濟困難、沒有獨立取得水分的能力，如老年人或孩童","文化習俗影響水分的取得","對於適當水分攝取之食物及營養相關知識不足","心理因素，如：憂鬱症或攝食異常","認知能力不足，包括學習障礙、神經性或感覺器官受損，及/或失智症"],"ind":[["生化數值，醫療檢驗及流程",["血漿或血清滲透壓大於290mOsm/kg","BUN、Na異常","↓尿量","↑尿液比重","糖尿病人出現高血糖"]],["體位測量",["體重快速減輕"]],["與營養相關的身體檢查發現",["皮膚與黏膜乾燥，皮膚失去彈性、心跳加快或正常、低血壓、發燒、呼吸頻率增加、頸部靜脈扁平(flattenedneckvein)","口渴","吞嚥困難","無感性水分流失增加"]],["飲食/營養相關史",["紀錄或觀察如下：","估算的水分攝取低於需求量(幼兒依單位體表面積計算)","使用造成口渴感覺下降的藥物"]],["個案史",["有下列疾病診斷或治療相關的狀況，如：失智症導致口渴的認知下降、脫水、糖尿病、腎功能異常、腹瀉、嘔吐、迴腸造口、結腸造口、感染"]]],"notes":["無論何時，營養素攝取量的數據應與臨床、生化及體位的資料，以及醫療診斷、臨床表徵及/或其他因素，也包括飲食一併考量，以提供一個具實證完整性之有效的營養評估。(InstituteofMedicine.DietaryReferenceIntakes:Applications in Dietary Assessment.Washington, DC: NationalAcademies Press; 2000)","＊若有需要，對於不足(Inadequate)的同義字為不太理想或未達標準(Suboptimal)"]},"NI-3.2":{"zh2016":"水分攝取過量","file":"NI","page":78,"def":"水分的攝取量大於既定參考標準或個人生理需求之建議量。","ety":["生理因素造成，如：腎臟、肝臟、心臟、內分泌、神經的或肺臟的功能異常；氣候或運動改變導致水分和鈉的流失減少，抗利尿激素分泌異常症候群(SIADH)","對於適當水分攝取之食物及營養相關知識不足","心理因素造成，如：憂鬱症和攝食異常"],"ind":[["生化數值，醫療檢驗及流程",["↓血漿滲透壓(270-280mOsm/kg)，只有水分正平衡超過鈉的正平衡時","↓血鈉(SIADH時)","↓尿比重"]],["體位測量",["體重增加"]],["與營養相關的身體檢查發現",["腿部、薦骨處、或全身性水腫；下肢滲出液體","腹水","肺水腫致呼吸短促；端坐呼吸(orthopnea)；呼吸有不連續音或胸部羅音","噁心、嘔吐、厭食、頭痛、肌肉痙攣、抽搐","費力或休息時呼吸短促或呼吸困難","給藥時使用大量水分","使用會影響水分的排出的藥物"]],["飲食/營養相關史",["紀錄或觀察如下：","估算水分的攝取量超過需求量(幼兒依單位體表面積計算)","估算鹽的攝取超過建議量"]],["個案史",["有下列疾病診斷或治療相關的狀況，如：末期腎臟病、腎病症候群、心臟衰竭或肝臟疾病","昏迷(SIADH)"]]],"notes":[]},"NI-4.1":{"zh2016":"生物活性成份攝取不足(需指明)","file":"NI","page":82,"def":"生物活性物質攝取低於既定參考標準或個人生理需求之建議量。","ety":["對於生物活性成份建議攝取量之食物營養相關知識不足","含生物活性成份的食物獲取管道缺乏或受限","腸胃道結構或功能改變"],"ind":[["飲食/營養相關史",["紀錄或觀察如下：","估計含有下列成分的植物性食品攝取量低於建議量：水溶性纖維，如：洋車前子(↓總膽固醇及LDL-膽固醇)；大豆蛋白(↓總膽固醇及LDL-膽固醇)；β－葡聚糖，如：全燕麥產品(↓總膽固醇及LDL-膽固醇)；植物固醇和植物酯，如：強化瑪其林(fortifiedmargarines)(↓總膽固醇及LDL-膽固醇)；其他物質(有科學證據且已提出建議量者)；對於生物活性成份，無法正確說明或知識不完整"]],["個案史",["有下列疾病診斷或治療相關的狀況，如：心血管疾病、血膽固醇上升"]]],"notes":["DRIs並未將生物活性物質列入，因此並沒有建立最低需要量或上限攝取量。不過，營養師們可以就個案個別的目標，或其營養處方予以評估、比較其攝取量是否足夠或過量。","正在研擬的生物活性物質定義-食物中可能對健康有影響的生理活性成份，目前還沒有科學一致性的定義。","＊若有需要，對於不足(Inadequate)的同義字為不太理想或未達標準(Suboptimal)"]},"NI-4.2":{"zh2016":"生物活性成份攝取過多(需指明)","file":"NI","page":86,"def":"生物活性成份攝取高於既定參考標準或個人生理需求之建議量。","ety":["對於生物活性成份，包含食品添加物，攝取建議量之食物與營養相關知識不足","汙染、錯誤名稱、錯誤或沒有標示、使用錯誤、近期商標變更、劑量增加、近期配方組合變更","經常攝取富含生物活性成份的食品","腸胃道結構及/或功能改變","適當食物取得受限，如：具食品標示產品之商店不足"],"ind":[["生化數值，醫療檢驗及流程",["生化報告顯示特定物質攝取過量，如：同時攝取植物固醇或植物酯及降血脂藥物statin，且同步飲食改變或服用其他藥物，導致快速↓膽固醇","↑肝臟酵素升高反應出肝細胞受損"]],["體位測量",["消化或吸收不良導致體重下降"]],["與營養相關的身體檢查發現",["便秘、腹瀉、噁心、胃痛、產氣、腹部絞痛或脹氣、嘔吐、心灼熱","神經病變，如：焦慮、精神狀態改變","心臟血管的改變，如：心跳速率、血壓","攝取過多生物活性成份如：水溶性纖維、β－葡聚糖和大豆蛋白導致的不適或疼痛","頭痛/偏頭痛","蕁麻疹、臉潮紅","激動或神經質"]],["飲食/營養相關史",["紀錄或觀察如下：","攝食大量富含下列成份之植物性食品；大豆蛋白(↓總膽固醇及LDL-膽固醇)；β－葡聚糖，如全燕麥產品(↓總膽固醇及LDL-膽固醇)；植物固醇和植物酯，如：fortifiedmargarines(↓總膽固醇及LDL-膽固醇)或其他食物的濃縮物、代謝產物、組成分、萃取物、或前述的混合物；食物中含有干擾消化、吸收的成份；方便取得含生物活性成份之食物/產品，如：來自膳食補充品供應商；企圖使用含生物活性成份的補充品減重、治療便秘、預防或治療急慢性疾病等；其他物質(已有科學證據並提供建議攝取量)；個案攝取到無法耐受之食品添加物(如：黃色5、6號、黃樟素、FD&CRed#4號、胭脂紅、味精、亞硫酸鹽等)；對於生物活性成份，無法正確說明或知識不完整"]],["個案史",["有下列疾病診斷或治療相關的狀況，如：心血管疾病、膽固醇升高、高血壓、氣喘","心血管功能改變，如：EKG異常"]]],"notes":["DRIs並未將生物活性物質列入，因此並沒有建立最低需要量或上限攝取量。不過，營養師們可以就個案個別的目標，或其營養處方予以評估、比較其攝取量是否足夠或過量。","正在研擬的生物活性物質定義-食物中可能對健康有影響的生理活性成份，目前還沒有科學一致性的定義。"]},"NI-4.3":{"zh2016":"酒精攝取過多","file":"NI","page":91,"def":"酒精攝取多於建議的限量。","ety":["對於食物或營養相關議題的信念/態度沒有科學證據","對於適量酒精攝取之食物與營養相關知識不足","缺乏行為改變的核心價值，有競爭的價值觀","酒精成癮"],"ind":[["生化數值，醫療檢驗及流程",["↑麩草醋酸轉胺酶(AST)、γ-麩胺醯轉移酶(GGT)、糖基缺乏轉鐵蛋白(carbohydrate-deficienttransferrin,CDT)、平均血球體積(MCV)、血液酒精濃度"]],["飲食/營養相關史",["紀錄或觀察如下：","男性攝取量大於2個酒精當量/天","女性攝取量大於1個酒精當量/天","有一次大量飲酒的行為(bingedrinking)","有不能喝酒的狀況但仍然飲酒，如懷孕"]],["個案史",["有下列疾病診斷或治療相關的狀況，如：嚴重的高三酸甘油酯血症、血壓上升、憂鬱症、肝臟疾病、胰臟炎","出現新醫療診斷或過去診斷或病情改變","曾有飲酒過量的紀錄","生過出現新生兒酒精症候群的孩子"]]],"notes":["*1個酒精當量=5oz(150cc)紅酒=12oz(350cc)啤酒=1.5oz(45cc)蒸餾酒"],"flags":["生化項「麩草醋酸轉胺酶(AST)」譯名有誤，應為「麩胺酸草醋酸轉胺酶」（aspartate aminotransferase）"]},"NI-5.1":{"zh2016":"營養素需求增加(需指明)","file":"NI","page":94,"def":"依據既定參考標準或個人生理需求之建議量，某些特定的營養素需求增加。","ety":["營養素的吸收或代謝改變，如：藥物引起","與腸胃功能相關的器官受損，如：胰、肝","具功能的小腸長度變短，如：短腸症","腸道功能降低或受損，如：乳糜瀉(celiacdisease)、克隆氏症(Crohn’sdisease)","營養素需求增加，如：快速成長、傷口癒合中、慢性感染等"],"ind":[["生化數值，醫療檢驗及流程",["↓總膽固醇＜160mg/dL，白蛋白、前白蛋白、CRP顯示生理壓力及代謝需求增加","電質解/礦物質(如：K、Mg、P等)異常","尿液或糞便中流失特定的或相關的營養素(如：糞便油脂、d-xylosetest)","維生素及/或礦物質缺乏"]],["體位測量",["生長遲緩(依據生長曲線圖)及胎兒發育遲滯","非計畫性體重減少，於一個月內大於5%或六個月大於10%","體重過輕(BMI<18.5)","體脂肪和肌肉質量佔比低"]],["與營養相關的身體檢查發現",["維生素/礦物質缺乏的臨床表徵(如：掉髮、牙齦出血、蒼白指甲)","皮膚組織流失、傷口癒合延遲、或壓瘡","肌肉組織及皮下脂肪流失"]],["飲食/營養相關史",["紀錄或觀察如下：","估算食物/營養補充品所攝取之營養素低於評估之需求量","攝取之食物所含的營養素量不足(如：過度加工、過度烹煮或儲存不當)","食物與營養相關知識不足，如：資訊缺乏或不正確，或對於攝取所需營養素不願遵從","藥物影響所需營養素的吸收或代謝","運動員或從事激烈體能活動的人"]],["個案史",["有下列疾病診斷或治療的狀況，如：截腸手術、克隆氏症、愛滋病、燒傷、早產及營養不良"]]],"notes":[],"flags":["生化第2項「電質解/礦物質」為「電解質」之錯字（英文Electrolyte/mineral）"]},"NI-5.2":{"zh2016":"蛋白質-熱量攝取不足","file":"NI","page":98,"def":"蛋白質及/或熱量攝取低於既定參考標準或個人近期生理需求之建議量。","ety":["代謝性疾病、吸收不良等的生理原因導致營養素需求增加","攝取足夠蛋白質和熱量的能力下降","食物獲取管道缺乏或受限制，如：經濟拮据、食物供給或選擇受限","文化或宗教習俗影響獲取食物的能力","對於適當量及型態的脂肪及/或蛋白質攝取之食物與營養相關知識不足","心理因素造成，如憂鬱症或攝食異常"],"ind":[["生化數值，醫療檢驗及流程",["血白蛋白值正常(蛋白質-熱量攝取減少，但肝功能正常)"]],["體位測量",["孕婦的體重增加不足(輕度)","成人體重減輕，3個月內7%、1個月內>5%，或1週1-2%；孩童任何體重減輕或沒有增加體重","孩童生長遲緩"]],["與營養相關的身體檢查發現",["壓瘡或手術後傷口癒合慢"]],["飲食/營養相關史",["紀錄或觀察如下：","估算的熱量攝取低於估計或測量的RMR，或建議量","某些類別食物受限或去除，如乳品或肉類(蛋白質)；穀類(熱量)等","近期對食物迴避或缺乏興趣","製備食物能力不足","酒精或降低飢餓感的藥物過量","無法獲取足夠食物致常感飢餓"]],["個案史",["有下列疾病診斷或治療相關的狀況：中度蛋白質－熱量攝取不足；近期疾病(如：肺部或心臟衰竭、流行性感冒、感染、手術等)","營養素吸收不良(如：胃間隔手術、腹瀉、脂肪痢)","缺乏購買適當食物的款項"]]],"notes":["無論何時，營養素攝取量的數據應與臨床、生化及體位的資料，以及醫療診斷、臨床表徵及/或其他因素，也包括飲食一併考量，以提供一個具實證完整性之有效的營養評估。(InstituteofMedicine.DietaryReferenceIntakes:Applications in Dietary Assessment.Washington, DC: NationalAcademies Press; 2000)","＊若有需要，對於不足(Inadequate)的同義字為不太理想或未達標準(Suboptimal)"],"flags":["個案史第1項「中度蛋白質－熱量攝取不足」與英文「mild protein-energy malnutrition」不符（mild應為輕度）"]},"NI-5.3":{"zh2016":"營養素需求減少(需指明)","file":"NI","page":102,"def":"某種特定營養素需求低於既定參考標準或依個人生理需求之建議量。","ety":["腎臟功能異常","肝臟功能異常","膽固醇代謝/調節異常","心臟衰竭","食物耐受不良，如：腸激躁症"],"ind":[["生化數值，醫療檢驗及流程",["↑總膽固醇>200mg/dL(5.2mmol/L),↑LDL-C>100mg/dL(2.59mmol/L),↓HDL-C<40mg/dL(1.036mmol/L),↑TG>150mg/dL(1.695mmol/L)","↑血磷值>5.5mg/dL(1.78mmol/L)","↓腎絲球過濾率(GFR)<90mL/min/1.73m2","↑BUN、肌酸酐、血鉀","↑肝功能檢驗呈現嚴重肝病"]],["體位測量",["兩次透析間體重增加大於預期"]],["與營養相關的身體檢查發現",["水腫/水分滯留"]],["飲食/營養相關史",["紀錄或觀察如下：","脂肪、磷、鈉、蛋白質或纖維等估計的攝取量大於建議量"]],["個案史",["有下列疾病診斷或治療相關的狀況，需要營養素特定的型態及/或數量，如：心血管疾病(脂肪)、早期腎病(蛋白質、磷)、末期腎病(磷、鈉、鉀、水分)、嚴重肝病(蛋白質)、心衰竭(鈉、水分)、腸激躁症/克隆氏病發作(纖維)","診斷出高血壓、肝臟疾病相關的迷亂"]]],"notes":[]},"NI-5.4":{"zh2016":"營養素不均衡","file":"NI","page":106,"def":"營養素組成不理想，如某一營養素的攝取量干擾或改變其他營養素的吸收或利用。","ety":["攝取高劑量的營養補充品","對於營養素間交互作用之食物與營養相關知識不足","對於食物或營養相關資訊的信念/態度沒有科學證據","追隨流行食物","開始給食(PN/EN，包括經口進食)的初期，電解質不足"],"ind":[["生化數值，醫療檢驗及流程",["嚴重低血磷症(醣類增加時)","嚴重低血鉀症(蛋白質增加時)","嚴重低血鎂症(醣類增加時)"]],["與營養相關的身體檢查發現",["腹瀉或便秘(補充鐵劑)","上腹痛、噁心、嘔吐或腹瀉(鋅補充劑)"]],["飲食/營養相關史",["紀錄或觀察如下：","鐵劑攝取大於建議量(鋅的吸收降低)","鋅補充劑攝取大於建議量(銅含量降低)","鎂攝取大於建議量(鐵含量降低)"]],["個案史",["再餵食症候群"]]],"notes":[]},"NI-5.5.1":{"zh2016":"脂肪攝取不足","file":"NI","page":109,"def":"脂肪攝取低於既定參考標準或個人生理需求之建議量。","ety":["腸胃道結構及/或功能改變","食物選擇不理想，如：經濟的拮据、老人或兒童的食物配給有所限制、特殊的食物抉擇","文化習俗影響選擇適當食物的能力","對於適當的脂肪攝取量之食物與營養素相關知識不足","心理因素，如憂鬱症或攝食異常"],"ind":[["生化數值，醫療檢驗及流程",["↑三烯酸：四烯酸比(Triene-tetraene ratio)> 0.2"]],["體位測量",["生長遲滯","若熱量攝取不足則體重減輕"]],["與營養相關的身體檢查發現",["必需脂肪酸缺乏的鱗狀皮膚及皮膚炎"]],["飲食/營養相關史",["紀錄或觀察如下：","必需脂肪酸攝取低於總熱量10％(主要是靜脈營養相關)","對相關知識說明不正確或不完整","文化或宗教上的實踐影響食物攝取"]],["個案史",["有下列疾病診斷或治療相關狀況，如：長期的代謝分解性疾病(如：愛滋病、結核病、神經性厭食症、敗血症或手術造成的嚴重感染)","腸道切除、胰臟功能不足或肝病併發脂肪瀉造成嚴重的脂肪吸收不良、"]]],"notes":["此診斷不適用於減重或安寧照護時。","無論何時，營養素攝取量的數據應與臨床、生化及體位的資料，以及醫療診斷、臨床表徵及/或其他因素，也包括飲食一併考量，以提供一個具實證完整性之有效的營養評估。(Institute of Medicine. Dietary Reference Intakes: Applications in Dietary Assessment.Washington, DC: National Academies Press; 2000)","＊若有需要，對於不足(Inadequate)的同義字為不太理想或未達標準(Suboptimal)"]},"NI-5.5.2":{"zh2016":"脂肪攝取過多","file":"NI","page":113,"def":"脂肪攝取高於既定參考標準或個人生理需求之建議量。","ety":["對於適當脂肪攝取之食物與營養相關知識不足","對於食物、營養及其相關議題的信念/態度缺乏科學證據","健康食物選擇的管道缺乏或受限，如：照護者或父母未提供健康食物的選擇、遊民","口味、食慾或喜好改變","缺乏行為改變的核心價值，有競爭性的價值觀","生理因素造成脂肪需求或建議量減少"],"ind":[["生化數值，醫療檢驗及流程",["↑總膽固醇>200 mg/dL (5.2 mmol/L),↑LDL-C>100 mg/dL (2.59 mmol/L),↓HDL-C<40mg/dL (1.036 mmol/L),↑TG>150 mg/dL (1.695 mmol/L)","↑血清澱粉酶及/或脂肪酶","↑肝功能檢測值(LFTs)或總膽紅素","↑糞便脂肪> 藥物、精神疾病用藥，或藥物中含有不建議型態的醣類","文化或宗教習俗影響醣類攝取"]],["個案史",["有下列疾病診斷或治療的相關狀況，如：食物不耐症、先天性醣類代謝異常","某些醣類或含醣食物所引起的過敏反應或耐受不良","經濟因素導致適當食物取得受限"]]],"notes":["對穀類的蛋白質(如榖蛋白：gluten)不耐受，應使用「蛋白質攝取類別不符合需求」(NI-5.6.3)參考表單記錄。","雖然研究並不支持以限制個別型態的醣類來控制血糖，不過營養師們可以針對特定個案的血糖控制狀況決定是否有需要，或為了其他理由，如健康飲食的促進而予以調整限制。"]},"NI-5.8.4":{"zh2016":"醣類攝取不一致","file":"NI","page":153,"def":"每天或每餐醣類攝取時間不一致，或醣類攝取的型態與生理或醫療需求所建議的不一致。","ety":["生理上的原因需要醣類攝取定時定量，如：糖尿病、低血糖症、施予PN/EN時","文化習俗影響醣類在固定時間攝取","對於適當時間攝取醣類之飲食與營養相關知識不足","飲食與營養遵從性差，如：缺乏意願或是無法按照營養師、醫師或照顧者所建議，調整醣類攝取時間","心理因素造成，如：憂鬱症、攝食異常"],"ind":[["生化數值，醫療檢驗及流程",["與醣類攝取不一致相關的低血糖或高血糖","血糖值變化大"]],["飲食/營養相關史",["紀錄或觀察如下：","估算的醣類攝取與建議的醣類型態不同，或進食時間不規則","使用胰島素或類胰島素","長期使用使血糖值異常的藥物，如：類固醇、抗憂鬱劑、精神病用藥","口述相關知識不準確或不完整","文化或宗教習俗影響醣類攝取量"]],["個案史",["有以下疾病診斷或治療相關的狀況，如：糖尿病、肥胖、代謝症候群、低血糖症","經濟因素導致適當食物取得受限"]]],"notes":[]},"NI-5.8.5":{"zh2016":"纖維質攝取不足","file":"NI","page":158,"def":"纖維質攝取低於既定參考標準或個人生理需求之建議量。","ety":["含纖維質食物/飲品的獲取管道缺乏或受限","對於理想纖維質攝取量之飲食與營養相關知識不足","心理因素造成，如：憂鬱症及攝食異常","長期使用低纖維質或低渣飲食","對於高纖維食物咀嚼或吞嚥困難","經濟因素造成適當食物取得受限","沒能力或無意願採買富含纖維質的食物","食物製備習慣不理想，如：依賴過度加工食品、過度烹調食物等"],"ind":[["與營養相關的身體檢查發現",["糞便量不足"]],["飲食/營養相關史",["紀錄或觀察如下：","估算膳食纖維質攝取量無法達到建議量(男性38克/天，女性25克/天)","口述相關知識不準確或不完整"]],["個案史",["有以下疾病診斷或治療的相關狀況，如：潰瘍、發炎性腸病、短腸症候群使用低纖維飲食"]]],"notes":["無論何時，營養素攝取量的數據應與臨床、生化及體位的資料，以及醫療診斷、臨床表徵及/或其他因素，也包括飲食一併考量，以提供一個具實證完整性之有效的營養評估。(Institute of Medicine. Dietary Reference Intakes: Applications in Dietary Assessment.Washington, DC: National Academies Press; 2000)","＊若有需要，對於不足(Inadequate)的同義字為不太理想或未達標準(Suboptimal)"]},"NI-5.8.6":{"zh2016":"纖維質攝取過多","file":"NI","page":162,"def":"纖維質攝取高於既定參考標準或個人生理需求之建議量。","ety":["對於攝取理想纖維質量之食物與營養相關知識不足","或營養相關議題的信念或態度不具有科學證據，如：過渡堅持排便的頻率與習慣","缺乏攝取適當纖維量的知識","製備食物或飲食型態只接受高纖食物，排除其他營養素密度高的食物"],"ind":[["與營養相關的身體檢查發現",["噁心、嘔吐、過多的脹氣、腹瀉、腹部絞痛、糞便量或次數過多導至不適"]],["飲食/營養相關史",["紀錄或觀察如下：","估計纖維攝入量高於所能耐受，或現階段醫學上的建議","口述相關知識不準確或不完整","口述對食物的信念或態度不具科學證據"]],["個案史",["有以下疾病診斷或治療的相關狀況，如:潰瘍疾病、腸躁症、發炎性腸病、短腸症候群、憩室炎、阻塞性便秘、脫垂型痔瘡、腸胃道狹窄、進食異常(eating disorder)或是精神疾病伴隨強迫性傾向","腸阻塞、植物性糞石(phytobezo nt-Generated-Subjective Global Assessment, PG-SGA）和長式簡易營養評估量表（Mini Nutritional Assessment-Long Form, MNA-LF），均可使用於營養不良之評估。","The Academy/ASPEN對於成人營養不良的共識陳述建議：最少應有兩項臨床特徵或指標才能診斷營養不良","更多資訊請參閱：https://www.eatrightpro.org/practice/practice-resources/malnutrition","成人手握力參考值依所使用的設備而定，能用來鑒別營養不良，但不能定量其缺乏的程度，也可能不適用於某些病人，其他資訊請參考The Academy/ASPEN對於成人及兒童營養不良的共識陳述","＊過去肝臟轉運蛋白質的測量值(如：白蛋白、前白蛋白)會被用作營養不良的指標，相關議題可參考Evidence Analysis Labrary，pttps://www.andevidncelibrary.com/topic.cfm?cat=4302. Accessed April 3, 2017"],"indPages":"12–17","flags":["定義中「非中重度」為 \"Non severe (moderate)\" 的誤譯（應為「非嚴重（中度）」，指標表內即譯作「非嚴重（中度）」）","＊註腳中「Evidence Analysis Labrary」與網址「pttps://www.andevidncelibrary.com」為誤植（英文為 Evidence Analysis Library、https://www.andevidencelibrary.com）"]},"NC-4.1.3":{"zh2016":"急性疾病或損傷導致的營養不良（營養缺乏）","file":"NC17","page":20,"def":"經過一段時間的蛋白質或熱量攝取不足而導致體脂肪或肌肉組織流失，且包含明顯因急性疾病或損傷導致的發炎反應。非中重度及嚴重急性或損傷相關的營養不良特徵也包含於此。","ety":["生理因素導致營養素的需求增加，如：急性病症或損傷/嚴重創傷","生理因素導致厭食症或減少營養素上的攝取","腸胃道的構造及/或功能異常","對於食物和營養之熱量及蛋白質量和種類的相關知識缺乏"],"ind":[],"notes":["各國都致力於制訂成人營養不良的定義。目前，eNCPT營養不良指標是反應The Academy/ASPEN成人營養不良共識聲明之營養不良臨床徵兆。三個不同的營養評估方式如附件，包含主觀性整體評估表(Subjective Global Assessment，SGA)、病人主觀性整體評估表（Patient-Generated-Subjective Global Assessment, PG-SGA）和長式簡易營養評估量表（Mini Nutritional Assessment-Long Form, MNA-LF），均可使用於營養不良之評估。","The Academy/ASPEN對於成人營養不良的共識陳述建議：最少應有兩項臨床特徵或指標才能診斷營養不良","更多資訊請參閱：https://www.eatrightpro.org/practice/practice-resources/malnutrition","成人手握力參考值依所使用的設備而定，能用來鑒別營養不良，但不能定量其缺乏的程度，也可能不適用於某些病人，其他資訊請參考The Academy/ASPEN對於成人及兒童營養不良的共識陳述","＊過去肝臟轉運蛋白質的測量值(如：白蛋白、前白蛋白)會被用作營養不良的指標，相關議題可參考Evidence Analysis Labrary，pttps://www.andevidncelibrary.com/topic.cfm?cat=4302. Accessed April 3, 2017"],"indPages":"22–26","flags":["定義中「非中重度」為 \"Non severe (moderate)\" 的誤譯（應為「非嚴重（中度）」，指標表內即譯作「非嚴重（中度）」）","＊註腳中「Evidence Analysis Labrary」與網址「pttps://www.andevidncelibrary.com」為誤植（英文為 Evidence Analysis Library、https://www.andevidencelibrary.com）"]},"NC-4.1.4":{"zh2016":"和疾病無關的兒科營養不良（營養缺乏）","file":"NC17","page":29,"def":"因環境或行為因素導致營養攝取不足，這可能影響成長、發展及/或其他指標。","ety":["食物獲取管道缺乏或受限，如：經濟拮拒、孩童的食物給予/餵食受限、被忽視或受虐、自資源匱乏或長期戰亂的國家近期被領養/移民/難民等。","中斷或是餵食耐受不良。","社會、經濟、行為、文化或宗教習俗影響食物的取得能力"],"ind":[],"notes":["The Academy/ASPEN兒科營養不良共識聲明建議中只有一個指標符合時，應使用特定指標，當有兩個及以上的指標符合時，使其他的指標來診斷營養不良。","更多資訊請見參考資料中的著作並造訪學會的網址https://www.eatrightpro.org/practice/practice-resources/malnutrition","在The Academy/ASPEN兒科營養不良共識聲明中陳述之替代測量方法可以在傳統測量方法無法測得數據時使用。",">6歲的孩童手握力參考值依所使用的設備而定，能用來鑒別營養不良，但不能定量其缺乏的程度，也可能不適用於某些病人。其他資訊請參考The Academy/ASPEN對於兒科營養不良的共識陳述。","＊過去肝臟轉運蛋白質的測量值(如：白蛋白、前白蛋白)會被用作營養不良的指標，相關議題可參考Evidence Analysis Labrary，pttps://www.andevidncelibrary.com/topic.cfm?cat=4302. Accessed April 3,2017."],"indPages":"30–35","flags":["與營養相關的身體檢查發現中「嚴重的營養不良」區塊出現兩次（第一組為「大量減少/嚴重蓄積」，第二組為「重度的…」），英文只有一組 Severe malnutrition","＊註腳中「Evidence Analysis Labrary」與網址「pttps://www.andevidncelibrary.com」為誤植（英文為 Evidence Analysis Library、https://www.andevidencelibrary.com）"]},"NC-4.1.5":{"zh2016":"和疾病相關的兒科營養不良（營養缺乏）","file":"NC17","page":37,"def":"因疾病或損傷導致營養缺乏或失衡，這可能負向影響成長、發展及/或其他指標。","ety":["因早產、基因/先天性障礙、疾病、損傷或創傷等生理因素而導致營養素需求增加。","與厭食症或餵食耐受不良相關的攝食不足","腸胃道的構造及/或功能異常","營養素代謝使用異常","對於食物和營養之熱量及蛋白質量和種類的相關知識缺乏","心理因素，如：憂鬱症或攝食障礙"],"ind":[],"notes":["The Academy/ASPEN兒科營養不良共識聲明建議中只有一個指標符合時，應使用特定指標，當有兩個及以上的指標符合時，使其他的指標來診斷營養不良。","更多資訊請見參考資料中的著作並造訪學會的網址https://www.eatrightpro.org/practice/practice-resources/malnutrition","在The Academy/ASPEN兒科營養不良共識聲明中陳述之替代測量方法可以在傳統測量方法無法測得數據時使用。",">6歲的孩童手握力參考值依所使用的設備而定，能用來鑒別營養不良，但不能定量其缺乏的程度，也可能不適用於某些病人。其他資訊請參考The Academy/ASPEN對於孩童營養不良的共識陳述。","＊過去肝臟轉運蛋白質的測量值(如：白蛋白、前白蛋白)會被用作營養不良的指標，相關議題可參考Evidence Analysis Labrary，pttps://www.andevidncelibrary.com/topic.cfm?cat=4302. Accessed April 3,2017."],"indPages":"38–43","flags":["中文標題代碼印為「（NC-4.1.4）」，應為 NC-4.1.5（英文標題為 Illness Related Pediatric Malnutrition (NC-4.1.5)）","＊註腳中「Evidence Analysis Labrary」與網址「pttps://www.andevidncelibrary.com」為誤植（英文為 Evidence Analysis Library、https://www.andevidencelibrary.com）"]},"NB-1.1":{"zh2016":"知識不足","file":"NB","page":1,"def":"對於食物、營養或營養相關資訊及飲食指南等相關知識認知不完整或不正確。","ety":["對於食物與營養相關議題的信念/態度沒有科學證據","未接受過飲食衛教","不瞭解嬰幼兒發出飢餓的訊號","文化背景與信念影響學習/應用資訊的能力","認知能力受損，包括學習障礙、神經或感覺受損及/或失智症","過去接受到錯誤的訊息","不願意或沒興趣學習/應用相關資訊","不確定如何應用營養相關資訊"],"ind":[["飲食/營養相關史",["紀錄或觀察如下：","口述的知識不正確或不完整","針對需填寫的問卷/書面文件，回答不正確或不完整，也可能無法閱讀文字資料","未曾接受食物與營養相關需求的建議","從未接受如何應用食物與營養的訊息","應用食物與營養相關資訊的能力不足，如:依照營養治療原則選擇食物，或依指示製備嬰幼兒食物","涉及過去學習新知的企圖","口述没意願或没興趣學習新知"]],["個案史",["有某種疾病診斷或治療的相關狀況","有新的醫療診斷或既有的診斷與病況改變","種族或文化相關的議題影響到新知應用"]]],"notes":["*若需要，對於“食物、營養或營養相關知識不足”的同義詞為“食物、營養或營養相關知識有限。"],"flags":["同義詞註腳缺右引號：「“食物、營養或營養相關知識有限。」（原文印刷漏字）"]},"NB-1.2":{"zh2016":"對於食物或營養相關議題的信念/態度不具科學證據","file":"NB","page":5,"def":"對於食物、營養及其相關議題的信念/態度或實踐，和大眾瞭解的營養原則、營養照護準則或疾病狀況(排除異常的飲食型態及攝食異常)不相合。","ety":["不信任以科學為根據的食物和營養資訊","之前未接收到正確的營養相關資訊","飲食行為是為了不是營養的其他目的(如：異食症)","期待使用替代療法治癒某種慢性疾病"],"ind":[["飲食/營養相關史",["紀錄或觀察如下：","偏好流行食物","估算攝食量反映出營養素/食物類別攝取不均衡","對某些食物/某些類別食物迴避(如：糖、小麥、熟食等)","攝食非食品品項","使用一些可能對健康無益的補充療法、另類療法的產品或膳食補充品"]],["個案史",["與疾病診斷或治療有關的狀況，如：肥胖、糖尿病、癌症、心血管疾病、精神疾病","異食癖","食物的癖好"]]],"notes":[]},"NB-1.3":{"zh2016":"尚未準備好飲食/生活型態的改變","file":"NB","page":9,"def":"缺少改變營養相關行為的認知價值觀，尤其是當與所付代價相比時；與個人價值觀相牴觸；有需要行為改變的前次事件。","ety":["對於食物、營養及其相關議題的信念/態度不具科學證據","認知能力受損，包括學習障礙、神經或感官受損，及/或失智","缺乏執行改變的社會支持","否定改變的需要","自覺在時間、人際關係或財務的限制上阻礙了其改變","無意願或沒興趣學習/應用資訊","缺乏改變的自我效能(self-efficacy)，或曾有失敗經驗而士氣低落"],"ind":[["與營養相關的身體檢查發現",["負面的肢體語言，如：皺眉、缺乏眼神交會、防禦姿態、注意力不集中、坐立不安。(Note：肢體語言會有文化差異)"]],["飲食/營養相關史",["紀錄或觀察如下：","否定食物或營養相關改變的需要性","無法了解改變的需要性","對後續追蹤或諮詢的安排未能履約","先前有行為改變失敗的經驗","對改變具防禦性、敵意、抗拒","缺少改變的效益或無法克服改變的障礙","影響身體活動進行的因子"]]],"notes":[]},"NB-1.4":{"zh2016":"自我監測不足","file":"NB","page":13,"def":"缺乏追蹤個人改變進展的數據或紀錄。","ety":["對於自我監測之食物與營養相關知識不足","缺乏執行自我改變的社會支持","缺乏行為改變或力爭上游的價值觀","自覺缺乏資源(如：時間、經濟或人際關係等)，因而阻礙了改變","文化習俗影響個人改變的進展追蹤","認知能力受損，包括學習障礙、神經或感官受損，以及/或失智","先前接收過有矛盾的資訊","尚未準備好飲食/生活型態的改變","不願意或無興趣追蹤改變的進度","不注意細節，時間管理和/或組織能力有困難"],"ind":[["生化數值，醫療檢驗及流程",["紀錄的資料和生化檢驗值不一致，如：估算的飲食攝取量和生化檢驗值不一致"]],["飲食/營養相關史",["紀錄或觀察如下：","自我監測紀錄不完整，如：血糖、食物、水分攝取、體重、體能活動、人工造廔輸出量紀錄等","估計的食物攝取量和體重或生長數據資料不一致","對於需要自我監測覺得難堪或生氣","不確定如何完成監測紀錄","不確定所能或所應做的修正一定會反應在自我監測的數據上","沒有自我管理的儀器裝備，如：沒有血糖機、計步器等","口述不準確或知識不完整","文化或宗教慣例影響攝取量"]],["個案史",["有需要自我監測的相關疾病診斷，如：糖尿病、肥胖、新增人工造廔等","有新的疾病診斷或過去的診斷與病況改變","缺乏社會與家庭的支持"]]],"notes":["*若需要，對於“自我監測不足”的同義詞為“自我監測受限”。"]},"NB-1.5":{"zh2016":"攝食異常","file":"NB","page":18,"def":"與飲食及體重管理相關的信念、態度、想法及行為，包括典型的攝食異常，以及對健康不利，但嚴重度較低的攝食異常類似狀況。","ety":["家族的、社會的、生物來源或遺傳的，以及/或環境相關所導致過度渴望「纖細的瘦」","對體重控制既有想法明顯影響自尊"],"ind":[["生化數值，醫療檢驗及流程",["↓膽固醇、血脂肪異常、低血糖、低血鉀(神經性厭食症：AN)","低血鉀和低血氯的鹼中毒(神經性暴食症：BN)","低血鈉、甲狀腺功能減退、BUN增加(AN)","尿液有酮(AN)"]],["體位測量",["BMI<17.5、生長及發育停滯、生長期但體重不增加、體重低於預期85%(AN)","BMI>29(非特異性的攝食異常：EDNOS)","明顯的體重起伏(BN)"]],["與營養相關的身體檢查發現",["脂肪組織及體蛋白質嚴重耗損(AN)","臉及軀幹長有胎毛、頭髮容易斷裂、手腳青紫，以及皮膚乾燥(AN)","脂肪組織正常或過多，以及體蛋白質貯存正常(BN、EDNOS)","牙齒琺瑯質受損(BN)","腮腺腫大(BN)","周邊組織水腫(BN)","骨骼肌減少(AN)","體溫低","注意力不集中(AN)","出現Russell’s Sign(BN)，自我催吐使手背長出硬繭","心跳緩慢(<60下/分)，低血壓(收縮壓<90mmHg)，和直立性低血壓(AN)","自行的催吐、使用瀉劑的腹瀉、嗝氣、便秘及脹氣(BN)；經常覺得寒冷(AN)","肌肉無力、疲倦、脫水(AN，BN)","否認飢餓(AN)"]],["飲食/營養相關史",["紀錄或觀察如下：","拒絕食物或含熱量的飲品(AN，BN)","拒絕有食物供應的社交活動","對食物有恐懼感，或對食物或相關經驗具有不正確的觀念(AN，BN)","對食物與體重有先入為主的成見(AN，BN)","對目前流行飲食的知識豐富(AN，BN，EDNOS)","經常禁食(AN，BN)","在特定的時間內攝取大量食物，自我有失控的感覺(BN，EDNOS)","體能活動過量(AN，BN，EDNOS)","快速進食、一直吃到過飽不舒服，非因生理的飢餓而大量進食；因尷尬而獨自進食，且大吃後感到內疚(EDNOS)","私下進食(AN，BN)","有關食物對身體的影響有不理性的想法(AN，BN，EDNOS)","慢性節食的型態","過度信賴營養名詞及對於食物的營養成份有先入為主的成見","對食物的選擇缺乏彈性","濫用瀉藥、灌腸劑、利尿劑、興奮劑，以及/或促進新陳代謝的藥物(AN，BN)","過度使用食物調味及調和劑"]],["個案史",["有相關疾病診斷，如：神經性厭食症(AN)、BN(神經性暴食症)、暴食症、非特異性的攝食異常(EDNOS)、無月經","有情緒及焦慮異常史(如：憂鬱症、強迫症：OCD)、人格異常、物質濫用史","有攝食異常、憂鬱症、強迫症、焦慮症的家族史(AN，BN)","激動、憂鬱(AN，BN)","貧血","白血球減少","心律不整、心跳緩慢(AN，BN)"]]],"notes":["不適用於診斷「可接受的食物受限」(NI-2.11)。"]},"NB-1.6":{"zh2016":"營養相關建議遵從性差","file":"NB","page":26,"def":"個案對於同意要執行的某項營養介入，缺乏真正的改變。","ety":["缺乏改變要執行時的社會支持","缺乏行為改變或力爭上游的價值觀","對改變的能力缺乏自信","自覺缺乏資源(如：時間、經濟或人際關係等)，因而阻礙了改變","健康相關的行為改變沒有成功經驗","對於如何執行改變之食物與營養相關知識不足","對於應用/學習相關資訊沒有意願或缺乏興趣","對於食物或營養相關議題的信念或態度不具科學證據"],"ind":[["生化數值，醫療檢驗及流程",["生化檢驗值未達預期"]],["體位測量",["體位檢測值未達預期"]],["與營養相關的身體檢查發現",["負面的肢體語言，如：皺眉、眼神不接觸、注意力不集中、坐立不安、哭泣等(Note：肢體語言有文化差異)"]],["飲食/營養相關史",["紀錄或觀察如下：","食物/營養相關之成果未如預期","不記得曾同意的改變承諾","無法履行已同意回家要執行的工作","對於營養計畫遵從度差或不一致","未履行回診或約定的追蹤時間","缺乏對建議的營養相關改變重要性的認同","不確定如何一致性的應用食物/營養相關資訊","口述曾企圖應用食物/營養相關資訊但卻挫敗","口述之前的失敗經驗影響其有效改變目標行為","呈現出缺乏自我效能或改變的信心","關注其內部及/或外在影響改變的障礙"]],["個案史",["缺乏社會的及/或家庭的支持"]]],"notes":[]},"NB-1.7":{"zh2016":"食物選擇不理想","file":"NB","page":30,"def":"食物或飲品的選擇不符合參考標準值(如:DRIs)、全國性飲食指南(如：國人飲食指南、我的餐盤等)、食物品質參考標準(如：健康吃等)或營養處方界定的內容。","ety":["未曾接收到營養相關的正確訊息","文化習俗影響學習/應用資訊的能力","認知能力受損，包括學習障礙、神經性或感官受損、及/或失智症","極度的疲倦無力，或藥物、手術或放射治療的副作用","獲取建議食物的管道不足或受限","自覺缺乏資源(如：時間、經濟或人際關係等)導致選擇符合建議之食物受阻","對食物過敏或厭惡，阻礙其選擇符合建議的食物","缺乏施行或支持改變的動力及意願","不願意或沒興趣學習/應用相關資訊","心理因素如：憂鬱症或攝食異常"],"ind":[["生化數值，醫療檢驗及流程",["↑血脂肪檢測"]],["與營養相關的身體檢查發現",["與維生素及礦物質缺乏或過多符合的症狀"]],["飲食/營養相關史",["紀錄或觀察如下：","估算攝取量不符合參考標準值(如DRIs)、全國性飲食指南(國人飲食指南、我的餐盤等)、食物品質參考標準(如Healthy Eating Index)或營養處方的內容","對於飲食指南瞭解不完全或不正確","沒有能力執行指南提供的資訊","沒有能力選擇(如：通路問題)，或不情願或沒有興趣選擇與飲食指南相符的食物"]],["個案史",["有下列疾病診斷或治療的相關狀況，如：心理疾病"]]],"notes":["*若有需要，對於“食物選擇不理想”的同義詞為“不均衡的飲食”。"]},"NB-2.1":{"zh2016":"體能活動不足","file":"NB","page":35,"def":"低活動量或靜態的生活型態導致熱量的消耗減少並影響健康。","ety":["對於體能活動的認知或態度沒有科學證據","受傷、生活型態改變、病況(如心血管疾病、肥胖、腎臟疾病等)、失能或行動受限所導致的體能活動或日常生活的活動減少","對於體能活動有利於健康的營養相關知識不足","過去接觸正確的營養相關訊息不足","缺乏可模仿的偶像，如：對兒童而言","缺乏執行改變的社會支持","缺乏安全的運動環境及/或設施","缺少行為改變或力爭上游的價值觀","時間限制","財務上的限制可能使活動量不足，(如：器材、鞋子或需加入會員的花費等)"],"ind":[["體位測量",["肥胖：BMI>30(成人)，BMI>95百分位(兒童>3歲)"]],["與營養相關的身體檢查發現",["皮下脂肪過多，肌肉量不足"]],["飲食/營養相關史",["紀錄或觀察如下：","體能活動頻率低、持續性差，以及/或強度低","過多的靜態活動，如：看電視、閱讀、休閒及工作/上學時都在用電腦","非運動的身體活動產熱(NEAT)，如：坐、站、走路、坐立不安消耗低","心肺耐力低及/或肌肉強度低","某些藥物造成嗜睡或意識不清","影響體能活動途徑的因素"]],["個案史",["某些醫療診斷會造成活動量減少，如：關節炎、慢性倦怠症狀、病態性肥胖、膝蓋手術","精神科的診斷，如：憂鬱症、焦慮症等"]]],"notes":["*若有需要，對於“體能活動不足”的同義詞為“體能活動受限”。"]},"NB-2.2":{"zh2016":"體能活動過多","file":"NB","page":39,"def":"非自主或自主的身體活動或動作已干擾熱量需求、生長或超過維持健康所需。","ety":["異常的攝食","對於食物、營養及健身有非理性的信念與態度","成癮的行為或人格特質"],"ind":[["生化數值，醫療檢驗及流程",["↑肝臟酵素，如：LDH、AST","微量營養素異常，如：,↓血清ferritin、Zn及insulin-like growth factor-binding protein","↑血球容積增加","可能↑Cortisol值"]],["體位測量",["體重流失、生長及發育遲緩、體重未如預期生長時的增加(通常與攝食異常有關)"]],["與營養相關的身體檢查發現",["脂肪及體蛋白儲存耗盡(通常與攝食異常有關)","慢性肌肉酸痛"]],["飲食/營養相關史",["紀錄或觀察如下：","持續或反覆的高強度運動超過健康改善或運動的效益","每天鍛鍊缺乏休息及復元時間","受傷或生病時仍運動","為了運動撇下家庭、工作及社會責任","過度訓練"]],["個案史",["有以下疾病診斷或治療的相關狀況，如：AN、BN、暴食症、非特異性攝食異常、停經、應力性骨折","慢性疲勞","成癮、妄想或強迫傾向","免疫功能降低","經常性或長期的受傷及/或疾病"]]],"notes":[],"flags":["指標「微量營養素異常，如：, ↓血清ferritin…」中「如：」後多一逗號（原文誤植）"]},"NB-2.3":{"zh2016":"沒有能力自我照顧","file":"NB","page":44,"def":"能力不足或缺乏意願執行有益健康之食物與營養相關行為。","ety":["自我照顧的營養相關知識不足","缺乏執行改變的社會支持","執行自我管理工作的能力發展尚未準備就緒，如：幼兒","缺乏行為改變或力爭上游的價值觀","自覺缺乏資源(如：時間、經濟或人際關係等)阻礙了自我照顧","文化習俗影響執行自我照顧的能力","認知能力受損，包括：學習障礙、神經性或感官受損，以及/或失智症","先前接觸到相互矛盾的訊息","尚未準備好飲食或生活型態改變","無意願亦無興趣學習/應用相關資訊","缺乏自我管理的工具或決策指引"],"ind":[["飲食/營養相關史",["紀錄或觀察如下：","没有能力解讀數據或自我管理的工具","對於需自我監測感到尷尬或憤怒","不確定能夠或應該執行的改變會呈現在自我監測紀錄的數據上。","有需自我照顧的相關診斷，如：糖尿病、肥胖、心血管疾病、腎臟或肝臟疾病"]],["個案史",["有以下疾病診斷或治療的相關狀況，如：認知及情緒障礙","新的醫療診斷，或原診斷及狀況有所改變"]]],"notes":["＊若有需要，對於“沒有能力自我照顧”的同義詞為“自我照顧能力有限”。"]},"NB-2.4":{"zh2016":"製備食物/餐點的能力不足","file":"NB","page":48,"def":"因認知或身體的障礙妨礙食物及飲品的製備。","ety":["認知的能力受損，包括：學習障礙，神經性或感官功能受損，及/或失智症","心智或認知能力喪失，如：失智症","身體失能","極度疲倦或治療引起的其他副作用"],"ind":[["飲食/營養相關史",["紀錄或觀察如下：","攝食量整體的估計值減少","過度食用便利食品、即食調理餐點，或其他與家中製備差距大的外食，導致無法遵循營養處方","無法確認所準備的食物符合營養處方","無法採購並運送食物回家"]],["個案史",["有以下疾病診斷或治療的相關狀況，如：認知障礙，腦性麻痺，半身不遂，視力不良，嚴格的治療方案，近期手術"]]],"notes":["＊若有需要，對於“製備食物/餐點的能力不足”的同義詞為“製備食物/餐點的能力有限”。"]},"NB-2.5":{"zh2016":"生活營養品質(NQOL)差","file":"NB","page":52,"def":"營養相關問題或建議導致個案自認生活品質降低。","ety":["食物與營養相關知識不足","尚未準備好飲食/生活型態的改變","對目前或之前的營養治療(MNT)有負面看法","食物或活動相關行為執行困難","自我效能差","扭曲的身體形象","糧食不安全","缺乏執行改變的社會支持"],"ind":[["飲食/營養相關史",["紀錄或觀察如下：","NQOL評分不佳","QOL測量評分不佳，如：SF-36(包含36個問題的多用途健康問卷)或EORTC QLQ-C30(為癌症病人發展出之生活品質測量工具)","糧食不安全/無意願透過社區服務獲得食物","對營養治療(MNT)的建議感到挫折或不滿意","對控制不良感到挫折","MNT建議的相關資訊錯誤或不完整","無能力改變食物及身體活動相關的行為","關心之前學習資訊的企圖","MNT的建議影響社交生活","不願意或沒興趣學習資訊"]],["個案史",["有新的醫療診斷或既有的診斷或病況改變","近期其他的生活型態改變，如：戒菸、開始運動、工作轉換、住家地點轉換","缺乏家庭及社會支持","種族及文化相關問題"]]],"notes":[]},"NB-2.6":{"zh2016":"自我攝食困難","file":"NB","page":56,"def":"將食物或飲品送入口的功能受損。","ety":["生理功能受損造成無法抓取杯子及器皿，頭頸部支持及/或控制不佳，手移向嘴的協調動作有困難，嘴唇無法閉緊(或其他任何吸允的障礙)，手肘或手腕不能彎曲，以及端坐和背脊挺直有困難","身體強度或活動範圍受限","食物獲得的途徑及/或自我進食的輔助工具在適應上受限或缺乏","視力不佳","認知能力變差，包括學習障礙、神經性或感官系統受損，以及/或失智症","不願意或拒絕自我攝食。"],"ind":[["體位測量",["體重流失"]],["與營養相關的身體檢查發現",["黏膜乾燥，嘶啞或潮濕的聲音，舌頭突出","嘴唇無法緊閉、流口水","呼吸短促"]],["飲食/營養相關史",["紀錄或觀察如下：","被供應不方便自行進食的食物，如豆子、清湯類。","杯子、器皿掉落","用餐時間出現情緒障礙、焦慮或挫折","無法辨認食物","忘記進食","不適當的食物使用","拒絕進食或咀嚼","進食時不斷出現食物從器皿中濺出、溢出。","缺乏力氣或持久力舉起器皿或杯子","器皿刺傷","缺乏建議的進食輔助器具"]],["個案史",["有以下疾病診斷或治療的相關狀況，如：神經性異常、帕金森氏症、阿茲海默症、遲發性動作困難症、多發性硬化症、中風、癱瘓、發育遲緩等","身體障礙，如：手臂骨折、牽引、攣縮等","術後需維持躺臥姿勢","失智症/器質性腦症候群","吞嚥困難","震顫"]]],"notes":[]},"NB-3.1":{"zh2016":"攝取不安全的食物","file":"NB","page":60,"def":"預期或非預期攝取受污染的食物或各式飲料、有毒的農作物、具傳染性物質、細菌性物質、添加物、過敏原，及/或生物化學藥劑。","ety":["對於可能不安全的食物之營養相關知識不足","缺乏適當的食物/餵食(嬰兒、腸道配方、母乳)儲存和製備的知識","暴露於受污染的水或食物中，如：社區暴發疾病，由監督單位或責任機構正式紀錄","有精神疾病，迷亂，或認知改變","食物儲存環境或設備缺乏，如冰箱等","安全食物供應管道缺乏或受限，如：提供安全、無污染食物的市場不足"],"ind":[["生化數值，醫療檢驗及流程",["糞便檢驗呈現感染原陽性反應：如：listeria、沙門氏菌、肝炎病毒A、肝炎病毒E、大腸桿菌、圆孢子虫","毒品或藥物的毒性報告、血液或食物檢體等被驗出有毒性"]],["與營養相關的身體檢查發現",["脫水現象，如：黏膜乾燥，組織損傷","腹瀉、抽筋、脹氣、發燒、噁心、嘔吐、視力障礙、發冷、頭暈、頭痛"]],["飲食/營養相關史",["紀錄或觀察如下：","懷疑吃了含汞的魚(孕婦與哺乳婦)","非食物的品項(孕婦與哺乳婦)","生蛋、未滅菌的乳品、軟乳酪、未煮熟的肉類(嬰兒、孩童、免疫功能低下者、孕婦及哺乳婦、老年人)","野生植物、莓果類、蕈菇類","不安全的食物或產品(腸道營養品和嬰兒配方、母乳)儲存及製備","標示錯誤或沒有標示的食物","口述相關知識不準確或不完整"]],["個案史",["有以下疾病診斷或治療的相關狀況，如：細菌性、病毒性或寄生蟲感染的食物相關疾病，精神疾病、失智症","毒品、藥物中毒，以及生物性中毒","有毒食材或植物的中毒","心臟、神經、呼吸系統變化"]]],"notes":["＊若有需要，對於“breastmilk”的同義詞為“human milk”。"]},"NB-3.2":{"zh2016":"食物獲取受限","file":"NB","page":64,"def":"獲得足夠數量及種類之健康食物的能力下降，以致攝取量未達參考建議標準(如：DRIs)、國家飲食指南(如：我國扇形圖飲食指南、美國MyPlate)，或營養處方所界定的量","ety":["照顧者有意或無意的不提供食物，如：未予以足夠食物或進食上的協助，提供過多營養品質不佳的食物，有意虐待/忽視","採購及運送食物受限於社區位置及地理環境","對於足夠數量或種類多元之健康食物的營養相關知識不足","缺乏財務資源或求助管道去購買足夠份量或種類多元的健康食物","缺乏飲食計畫、採購及製備食物的技能","受限、缺乏、或無法獲取社區的食物補助或參與其他專案計畫，如：食物銀行、急難廚房、庇護所等","無法加入州政府的專案計畫，如：WIC、國家學童早午餐專案、食物券等","學校缺乏營養/健康政策或政策施行以保障在正餐、點心或學校活動時提供便利、開胃，且價格不高、又符合飲食文化的健康食物","生理或心理的限制造成購買能力下降，如：走路、視力、心理/情緒健康等","因為關心體重或老化而對食物有所限制","污染食物供應的影響"],"ind":[["生化數值，醫療檢驗及流程",["三大營養素或維生素/礦物質的相關檢測"]],["體位測量",["依生長參考建議，如：國家健康統計中心(NCHS)，出現生長停滯","體重過輕：BMI<18. const RS_SWAP={"NI-2.11":"NB-1.7","NB-1.7":"NI-2.11"};
const RS_FILE={NI:"攝取量",NC:"臨床面 2016",NC17:"臨床面 2017 新增",NB:"行為環境"};
function rsFor(code){
 if(RS_SWAP[code])return {key:RS_SWAP[code],moved:true};
 if(RS[code])return {key:code};
 let c=code;while(c.includes(".")){c=c.slice(0,c.lastIndexOf("."));if(RS[c])return {key:c,parent:true}}
 return null}
function rsHtml(code,zh2023){
 const f=rsFor(code);if(!f)return "";
 const r=RS[f.key],cite=c("S16",`${RS_FILE[r.file]} p.${r.page}`);
 const ul=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
 let head=`<p class="meta">以下依全聯會中譯參考表（2016 中文版、2017 新增修正版）${cite}`;
 if(f.parent)head+=`；本項沒有獨立參考表，內容為上層診斷 ${esc(f.key)}「${esc(r.zh2016)}」的參考表`;
 else if(f.moved)head+=`；2023 版代碼與舊版對調，本項對應舊版 ${esc(f.key)}「${esc(r.zh2016)}」`;

let termQ="";
function termRows(){
 const q=termQ.trim().toLowerCase(), qz=termQ.trim();
 const hit=d=>!q||d.en.toLowerCase().includes(q)||d.zh.includes(qz)||d.code.toLowerCase().includes(q);
 let out="",total=0;
 ["NI","NC","NB","NO"].forEach(dm=>{
  const dmc=CLASSES.find(x=>x[0]===dm);
  const groups=CLASSES.filter(x=>x[0].startsWith(dm)&&(x[0]!==dm||dm==="NO"));
  let inner="",dmCount=0;
  groups.forEach(cl=>{
   const items=DX.filter(d=>clsOf(d.code)===cl[0]&&hit(d));
   if(!items.length)return;
   dmCount+=items.length;
   inner+=`<details class="cls"${q?" open":""}><summary>${esc(cl[2])}<span class="meta">　${esc(cl[1])}　<span class="mono">${esc(cl[0])}</span>　${items.length} 個</span></summary>
    <div class="tbl"><table><tbody>${items.map(d=>`<tr><td class="code">${esc(d.code)}</td><td>${rsFor(d.code)?`<details class="rsd"><summary>${esc(d.zh)}<div class="meta">${esc(d.en)}</div></summary>${rsHtml(d.code,d.zh)}</details>`:`${esc(d.zh)}<div class="meta">${esc(d.en)}</div>`}</td><td class="meta">${d.note?esc(d.note):""}</td></tr>`).join("")}</tbody></table></div></details>`;
  });
  if(!dmCount)return;
  total+=dmCount;
  out+=`<div class="dmgroup"><h5>${esc(dmc[2])}（${esc(dmc[1])}，${dm}）<span class="meta">　${dmCount} 個</span></h5>${inner}</div>`;
 });
 return out||`<p class="meta">找不到符合「${esc(termQ)}」的術語。</p>`;
}

function atGroups(dm){
 const lv1=Object.keys(AHEADS).filter(k=>k.startsWith(dm+"-")&&!k.includes("."));
 return lv1.map(k1=>{
  let gs;
  if(dm==="PD") gs=ATERMS.filter(t=>t[0].startsWith(k1+".1.")&&atDepth(t[0])===3).map(t=>({code:t[0],en:t[1],zh:t[2],self:true}));
  else{const l2=Object.keys(AHEADS).filter(k=>k.startsWith(k1+".")&&k.split(".").length===2);
   gs=l2.length?l2.map(k=>({code:k,en:AHEADS[k][0],zh:AHEADS[k][1]})):[{code:k1,en:AHEADS[k1][0],zh:AHEADS[k1][1]}]}
  return {code:k1,en:AHEADS[k1][0],zh:AHEADS[k1][1],groups:gs};
 });
}
function atRows(){
 const q=atQ.trim().toLowerCase(),qz=atQ.trim();
 const hit=t=>!q||t[1].toLowerCase().includes(q)||t[2].includes(qz)||t[0].toLowerCase().includes(q);
 let out="";
 ADOMS.forEach(([dm,en,zh])=>{
  let inner="",n=0;
  const G=atGroups(dm),single=G.length===1;
  G.forEach(c1=>{
   let cinner="";
   c1.groups.forEach(g=>{
    const items=ATERMS.filter(t=>(t[0]===g.code&&g.self)||t[0].startsWith(g.code+".")).filter(hit);
    if(!items.length)return;
    n+=items.length;
    const base=atDepth(g.code);let rows="",shown={};
    items.forEach(t=>{
     Object.keys(AHEADS).forEach(h=>{if(!shown[h]&&atDepth(h)>base&&!ATERMS.some(x=>x[0]===h)&&t[0].startsWith(h+".")){shown[h]=1;rows+=`<tr class="subh"><td class="code">${esc(h)}</td><td colspan="2"><b>${esc(AHEADS[h][1])}</b><span class="meta">　${esc(AHEADS[h][0])}</span></td></tr>`}});
     const ind=Math.max(0,atDepth(t[0])-base-1);
     rows+=`<tr><td class="code">${esc(t[0])}</td><td style="padding-left:${10+ind*14}px">${esc(t[2])}<div class="meta">${esc(t[1])}</div></td><td class="meta">p.${t[3]}${t[4]?"；"+esc(t[4]):""}</td></tr>`;
    });
    cinner+=`<details class="cls"${q?" open":""}><summary>${esc(g.zh)}<span class="meta">　${esc(g.en)}　<span class="mono">${esc(g.code)}</span>　${items.length} 個</span></summary><div class="tbl"><table><tbody>${rows}</tbody></table></div></details>`;
   });
   if(!cinner)return;
   const cn=(cinner.match(/<tr>/g)||[]).length;
   inner+=single?cinner:`<details class="cls lv1"${q?" open":""}><summary>${esc(c1.zh)}<span class="meta">　${esc(c1.en)}　<span class="mono">${esc(c1.code)}</span>　${cn} 個</span></summary><div class="sub">${cinner}</div></details>`;
  });
  if(n)out+=`<details class="cls dm"${q?" open":""}><summary><b>${esc(zh)}</b><span class="meta">　${esc(en)}　<span class="mono">${dm}</span>　${n} 個</span></summary><div class="sub">${inner}</div></details>`;
 });
 return out||`<p class="meta">找不到符合「${esc(atQ)}」的術語。</p>`;
}

const LAB=/(A1C|HbA1c|albumin|白蛋白|prealbumin|前白蛋白|BUN|creatinine|肌酸酐|eGFR|mg\/dL|g\/dL|mmol|mEq)/i;
function checksFor(i){
 const x=ST.pes[i],P=pName(x),out=[];
 if(!usedIdx().includes(i)) return i===0?[["muted","尚未填寫"]]:[];
 if(!P) out.push(["err","缺少 P。"]);
 else if(x.pc.trim()&&!DX.some(d=>d.en.toLowerCase()===x.pc.trim().toLowerCase())) out.push(["warn","此名稱不在 2023 版診斷術語中（S13），請改用標準術語。"]);
 if(!x.e.trim()) out.push(["err","缺少 E。"]);
 else{ if(!x.ecat) out.push(["warn","尚未選擇 E 的病因類別（S8、S12）。"]);
 if(LAB.test(x.e)) out.push(["warn","E 似乎含有實驗室數值。實驗室數值應放在 S，E 寫根本原因（S2）。"]);}
 if(!x.s.trim()) out.push(["err","缺少 S。"]);
 else{
  if(!/\d/.test(x.s)) out.push(["warn","S 沒有任何數值；請確認 S 夠具體、可監測變化（S8）。"]);
  const other=DX.filter(d=>d.en!==P && d.zh.length>=4 && !/malnutrition/i.test(d.en) && (x.s.toLowerCase().includes(d.en.toLowerCase())||x.s.includes(d.zh)));
  if(!other.length && !/knowledge deficit|知識不足/i.test(P) && /knowledge deficit|知識不足/i.test(x.s)) other.push({zh:"知識不足"});
  if(other.length) out.push(["warn","S 中出現另一個營養診斷名稱（"+other.map(d=>d.zh).join("、")+"）。S 應是證據，不是另一個診斷（S2 錯誤範例）。"]);
  if(/malnutrition|營養不良/i.test(P)&&/(albumin|白蛋白|prealbumin|前白蛋白)/i.test(x.s)) out.push(["warn","以血清白蛋白作為營養不良證據：GLIM 不建議以低白蛋白血症作為營養不良指標（S5）。"]);
 }
 if(/malnutrition|營養不良/i.test(P)) out.push(["muted","營養不良屬臨床面（Clinical）領域（S10）。S 可對應 GLIM（S5）或 Academy／ASPEN 的營養不良指標（S10），採用哪一套待教師審定。"]);
 const un=x.q.filter(v=>!v).length;
 if(P&&x.e.trim()&&x.s.trim()&&un) out.push(["muted",`自我檢查還有 ${un} 題未勾選。`]);
 if(P&&x.e.trim()&&x.s.trim()&&!out.length) out.push(["ok","三要素齊全，未發現規則性問題。仍需老師判斷內容是否合理。"]);
 return out;
}
function rankChecks(){
 const u=usedIdx(),out=[];
 if(u.length<2) return out;
 const ranks=u.map(i=>ST.pes[i].rank);
 if(new Set(ranks).size<ranks.length) out.push(["err","有 PES 的優先順序相同，請排出先後。"]);
 u.forEach(i=>{if(!ST.pes[i].why.trim()) out.push(["warn",`PES ${i+1} 沒有寫排序理由（嚴重度、病人價值、安全；S9）。`])});
 const names=u.map(i=>pName(ST.pes[i]).toLowerCase()).filter(Boolean);
 if(new Set(names).size<names.length) out.push(["warn","有兩組 PES 的 P 相同。每組應陳述一個不同的問題（S8）。"]);
 const ord=[...u].sort((a,b)=>(+ST.pes[a].rank)-(+ST.pes[b].rank));
 if(new Set(ranks).size===ranks.length&&ord.some((i,k)=>k>0&&domOf(ST.pes[i])==="NI"&&ord.slice(0,k).some(j=>domOf(ST.pes[j])&&domOf(ST.pes[j])!=="NI"))) out.push(["muted","若兩組 PES 其實描述同一個問題，條件相同時可改用攝取量（Intake）診斷（S8）；不同問題的先後請依嚴重度、病人價值與安全排序（S9）。"]);
 if(!out.length) out.push(["ok","各組 PES 已排序並寫明理由。"]);
 return out;
}
function linkChecks(){
 const out=[],used=usedIdx().map(i=>String(i+1));
 ST.inter.forEach((r,j)=>{if(r.t.trim()){
  if(!r.to)out.push(["warn",`介入 ${j+1} 沒有對應任何 E 或 S。`]);
  else if(!used.includes(r.to.slice(1)))out.push(["warn",`介入 ${j+1} 對應的 PES ${r.to.slice(1)} 尚未填寫。`]);
  else if(r.to[0]==="S")out.push(["muted",`介入 ${j+1} 以減輕 S 為目標。介入通常針對 E，較少數情況（例如處理 E 仍無法解決問題時）才以減輕 S 為目標（S8）；請確認理由。`]);}});
 ST.me.forEach((r,j)=>{if(r.ind.trim()){
  if(!r.cri.trim())out.push(["warn",`監測指標 ${j+1} 沒有判斷標準。Academy 示範把每項監測寫成指標加標準（S10）。`]);
  if(!r.to)out.push(["warn",`監測指標 ${j+1} 沒有對應任何 S。`]);else if(!used.includes(r.to))out.push(["warn",`監測指標 ${j+1} 對應的 PES ${r.to} 尚未填寫。`]);}});
 used.forEach(n=>{
  if(!ST.inter.some(r=>r.t.trim()&&r.to.slice(1)===n))out.push(["warn",`PES ${n} 沒有任何介入。`]);
  if(!ST.me.some(r=>r.ind.trim()&&r.to===n))out.push(["warn",`PES ${n} 的 S 沒有任何監測指標追蹤。`]);
 });
 if(used.length&&!out.some(o=>o[0]!=="muted"))out.push(["ok","每組 PES 都有介入與監測指標，且監測都有判斷標準。"]);
 return out;
}
const chkHtml=a=>a.map(([t,m])=>`<div class="chk"><span class="tag ${t==="ok"?"t-ok":t==="err"?"t-err":t==="warn"?"t-warn":"t-muted"}">${t==="ok"?"通過":t==="err"?"缺漏":t==="warn"?"提醒":"注意"}</span><span>${esc(m)}</span></div>`).join("");
/* ---------- 紀錄輸出（教學版／正式紀錄版） ---------- */
const NOTE_BAD=x=>/題目未提供|未提供|未知|不詳/.test(x);
const nSplit=(x,max)=>{const k=String(x).match(new RegExp(`^([^：:]{1,${max}})[：:]\\s*(.+)$`,"s"));return k?[k[1].trim(),k[2].trim()]:[null,String(x)]};
/* 把「標籤：內容」清單整理成 kv 與 grp（同標籤合併） */
function nItems(a,max){const order=[],m={};a.forEach(x=>{const [k,v]=nSplit(x,max);const key=k??"\u0000"+x;if(!(key in m)){m[key]=[];order.push(key)}m[key].push(k?v:x)});
 return order.map(k=>k[0]==="\u0000"?{k:"txt",text:k.slice(1)}:(m[k].length>1?{k:"grp",label:k,items:m[k]}:{k:"kv",label:k,value:m[k][0]}))}
/* 編號清單：若同標籤重複，合併成子群組 */
function nOl(label,a){if(!a.length)return null;const keys=a.map(x=>nSplit(x,12)[0]).filter(Boolean);
 if(keys.some((k,i)=>keys.indexOf(k)!==i))return {k:"ol",label,grouped:true,items:nItems(a,12)};
 return {k:"ol",label,items:a}}
function buildNote(d){
 const NO=d.fill?"（未填）":"目前沒有營養診斷（No nutrition diagnosis at this time）";
 const lab=t=>t?(t[0]==="E"?`針對 E${t.slice(1)}`:`減輕 S${t.slice(1)}`):"";
 const plain=x=>String(x||"").replace(/（[A-Za-z][^）]*）$/,"");
 const sent=(x,short)=>`${short?plain(x.P)||"（未填 P）":x.P||"（未填 P）"}，與${x.E||"（未填 E）"}有關，證據為${x.S||"（未填 S）"}。`;
 const empty=d.fill?[{k:"txt",text:"（未填）"}]:[];
 const V=(x,teach)=>x&&typeof x==="object"?(teach?x.t:x.f):x;
 const ord=[...d.pes].sort((a,b)=>(+a.rank||99)-(+b.rank||99)||a.n-b.n);
 const mk=teach=>{
  const comp=d.comp.map(x=>V(x,teach));
  const secA=[...nItems(d.subj.concat(d.obj),30),...(comp.length?[{k:"grp",label:"比較標準",items:comp,plain:true}]:[])];
  const D=!d.pes.length?[{k:"txt",text:NO}]:teach?d.pes.map(x=>{const ec=EY.find(e=>e[1]===x.ecat);return {k:"pes",n:x.n,rank:x.rank,P:x.P||"（未填）",E:x.E||"（未填）",S:x.S||"（未填）",full:sent(x,true),cat:ec?`${ec[2]}（${ec[0]}）`:"",why:x.why}})
   :ord.length>1?[{k:"ol",items:ord.map(x=>sent(x))}]:[{k:"txt",text:sent(ord[0])}];
  const I=[...(d.pres?[{k:"kv",label:"營養處方",value:V(d.pres,teach)}]:[]),nOl("介入策略",d.its.map(x=>teach&&x.target?`${V(x.text,teach)}（${lab(x.target)}）`:V(x.text,teach))),nOl("目標",d.goals)].filter(Boolean);
  const ME=d.mes.length?[{k:"tbl",head:teach?["指標","判斷標準","追蹤",...(d.mes.some(x=>x.gs)?["目標狀態"]:[])]:["指標","判斷標準"],
   rows:d.mes.map(x=>teach?[x.ind,V(x.cri,true)||"（未填）",x.target?`S${x.target}`:"—",...(d.mes.some(y=>y.gs)?[x.gs||"—"]:[])]:[x.ind,V(x.cri,false)||"（未填）"])}]:[];
  const adime=[{h:"A 營養評估",parts:secA.length?secA:empty},{h:"D 營養診斷",parts:D},...(I.length||d.fill?[{h:"I 營養介入",parts:I.length?I:empty}]:[]),...(ME.length||d.fill?[{h:"M&E 營養監測與評值",parts:ME.length?ME:empty}]:[])];
  const soap=[...(d.subj.length||d.fill?[{h:"S",parts:d.subj.length?nItems(d.subj,30):empty}]:[]),...((d.obj.length||d.comp.length||d.fill)?[{h:"O",parts:(d.obj.length||d.comp.length)?[...nItems(d.obj,30),...(comp.length?[{k:"grp",label:"比較標準",items:comp,plain:true}]:[])]:empty}]:[]),{h:"A",parts:D},...((I.length||ME.length||d.fill)?[{h:"P",parts:[...I,...(ME.length?[{k:"sub",text:"營養監測與評值"},...ME]:[]),...(!I.length&&!ME.length?empty:[])]}]:[])];
  return {adime,soap}};
 return {teach:mk(true),formal:mk(false)};
}
/* 純文字（複製用） */
function noteText(secs){
 const ol=(items,ind="")=>items.map((it,i)=>`${ind}${i+1}. ${it}`).join("\n");
 const gol=(items,ind)=>items.map(it=>it.k==="grp"?`${ind}${it.label}：\n${ol(it.items,ind+"  ")}`:it.k==="kv"?`${ind}${it.label}：${it.value}`:`${ind}${it.text}`).join("\n");
 const part=p=>{switch(p.k){
  case "kv":return `${p.label}：${p.value}`;
  case "grp":return `${p.label}：\n${p.plain?p.items.map(s=>`  ${s}`).join("\n"):p.items.map((s,i)=>`  ${i+1}. ${s}`).join("\n")}`;
  case "ol":return p.grouped?`${p.label}：\n${gol(p.items,"  ")}`:p.label?`${p.label}：\n${ol(p.items,"  ")}`:ol(p.items);
  case "txt":return p.text;
  case "sub":return `${p.text}：`;
  case "pes":return `PES ${p.n}（第 ${p.rank} 優先）\n  P${p.n}：${p.P}\n  E${p.n}：${p.E}\n  S${p.n}：${p.S}${p.cat?`\n  病因類別：${p.cat}`:""}${p.why?`\n  排序理由：${p.why}`:""}`;
  case "tbl":return `${p.head.join(" ｜ ")}\n${p.rows.map((r,i)=>`${i+1}. ${r.join(" ｜ ")}`).join("\n")}`;}};
 return secs.map(s=>`${s.h}\n${s.parts.map(part).join("\n")}`).join("\n\n");
}
/* HTML（畫面顯示用） */
function noteHtml(secs){
 const li=it=>`<li>${esc(it)}</li>`;
 const gli=it=>it.k==="grp"?`<div class="ni"><span class="nl2">${esc(it.label)}：</span><ol>${it.items.map(li).join("")}</ol></div>`:it.k==="kv"?`<p class="ni"><span class="nl2">${esc(it.label)}：</span>${esc(it.value)}</p>`:`<p class="ni">${esc(it.text)}</p>`;
 const part=p=>{switch(p.k){
  case "kv":return `<p><span class="nl">${esc(p.label)}：</span>${esc(p.value)}</p>`;
  case "grp":return `<div><span class="nl">${esc(p.label)}：</span>${p.plain?`<div class="ni">${p.items.map(s=>`<p>${esc(s)}</p>`).join("")}</div>`:`<ol>${p.items.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`}</div>`;
  case "ol":return p.grouped?`<div><span class="nl">${esc(p.label)}：</span>${p.items.map(gli).join("")}</div>`:`<div>${p.label?`<span class="nl">${esc(p.label)}：</span>`:""}<ol>${p.items.map(li).join("")}</ol></div>`;
  case "txt":return `<p>${esc(p.text)}</p>`;
  case "sub":return `<p class="nl" style="margin-top:6px">${esc(p.text)}：</p>`;
  case "pes":return `<div class="npes"><p class="nl">PES ${p.n}<span class="meta">　第 ${esc(p.rank)} 優先</span></p><table><tbody><tr><th>P${p.n}</th><td>${esc(p.P)}</td></tr><tr><th>E${p.n}</th><td>${esc(p.E)}</td></tr><tr><th>S${p.n}</th><td>${esc(p.S)}</td></tr></tbody></table>${p.cat||p.why?`<p class="meta">${p.cat?`病因類別：${esc(p.cat)}`:""}${p.cat&&p.why?"　｜　":""}${p.why?`排序理由：${esc(p.why)}`:""}</p>`:""}</div>`;
  case "tbl":return `<table class="ntbl"><thead><tr><th></th>${p.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${p.rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;}};
 return secs.map(s=>`<section class="nsec"><h5>${esc(s.h)}</h5>${s.parts.map(part).join("")}</section>`).join("");
}
const VER_NOTE={teach:"教學版：P1／E1／S1 編號、優先順序、病因類別、排序理由、「針對 E1」與追蹤欄，都是幫助對照的教學標記，正式病歷不寫。",formal:"正式紀錄版：只保留 Academy 官方範例出現的寫法（S8、S10），PES 依優先順序排列。中文連接詞「與……有關」「證據為」是本平台譯法。"};
function pesBlock(n,P,E,S){const p=P||"（未填）",e=E||"（未填）",s0=S||"（未填）";return `P${n}：${p}\nE${n}：${e}\nS${n}：${s0}\n（完整句子：${p}，與${e}有關，證據為${s0}。）`}
function pesSentence(x){const P=pName(x);return `${P||"（未填 P）"}，與${x.e.trim()||"（未填 E）"}有關，證據為${x.s.trim()||"（未填 S）"}。`}
function render(){
 ST.pes.forEach((x,i)=>{const sm=document.getElementById("pessum"+i);if(sm)sm.textContent="　"+pLabel(x)});
 ST.pes.forEach((_,i)=>{const el=document.getElementById("chk"+i);if(el)el.innerHTML=chkHtml(checksFor(i))});
 const rk=document.getElementById("chkRank");if(rk)rk.innerHTML=chkHtml(rankChecks());
 const lk=document.getElementById("chkLink");if(lk)lk.innerHTML=chkHtml(linkChecks());
 const lines=t=>t.split("\n").map(x=>x.trim()).filter(Boolean);
 const d={fill:true,subj:lines(ST.subj),obj:lines(ST.obj),comp:[],pres:"",goals:[],
  pes:usedIdx().map(i=>{const x=ST.pes[i];return {n:i+1,rank:x.rank,P:pLabel(x),E:x.e.trim(),S:x.s.trim(),ecat:x.ecat,why:x.why.trim()}}),
  its:ST.inter.filter(r=>r.t.trim()).map(r=>({text:r.t.trim(),target:r.to})),
  mes:ST.me.filter(r=>r.ind.trim()).map(r=>({ind:r.ind.trim(),cri:r.cri.trim(),target:r.to,gs:""}))};
 const secs=buildNote(d)[ST.ver||"teach"][ST.fmt];NOTE_TXT.out=noteText(secs);
 const vn=document.getElementById("vernote");if(vn)vn.textContent=VER_NOTE[ST.ver||"teach"];
 const o=document.getElementById("out");if(o)o.innerHTML=noteHtml(secs);
 save();
}
function bindPractice(){
 const app=document.getElementById("app");
 app.oninput=e=>{const t=e.target;
  if(t.id==="subj")ST.subj=t.value; else if(t.id==="obj")ST.obj=t.value;
  else if(t.dataset.q!==undefined){ST.pes[+t.dataset.i].q[+t.dataset.q]=t.checked}
  else if(t.dataset.cls!==undefined){const i=+t.dataset.cls;ST.pes[i].cls=t.value;ST.pes[i].p="";document.getElementById("p"+i).innerHTML=dxOpts(t.value,"")}
  else if(t.dataset.k){ST.pes[+t.dataset.i][t.dataset.k]=t.value}
  else if(t.dataset.l){ST[t.dataset.l][+t.dataset.j][t.dataset.f]=t.value}
  else return;
  render()};
 app.onchange=e=>{const t=e.target;
  app.oninput(e)};
 app.onclick=e=>{const t=e.target.closest("button");if(!t)return;
  if(t.id==="addPes"){ST.pes.push(blankPes(String(ST.pes.length+1)));pesOpen=new Set([...pesOpen,ST.pes.length-1]);save();show("practice")}
  else if(t.dataset.delpes!==undefined){const d=+t.dataset.delpes;ST.pes.splice(d,1);
   const fix=n=>{n=+n;return n===d+1?"":String(n>d+1?n-1:n)};
   ST.inter.forEach(r=>{if(r.to){const f=fix(r.to.slice(1));r.to=f?r.to[0]+f:""}});
   ST.me.forEach(r=>{if(r.to)r.to=fix(r.to)});
   ST.pes.forEach(x=>{if(+x.rank>ST.pes.length)x.rank=String(ST.pes.length)});
   pesOpen=new Set([...pesOpen].filter(k=>k!==d).map(k=>k>d?k-1:k));
   save();show("practice")}
  else if(t.id==="addInter"){ST.inter.push({t:"",to:"E1"});save();show("practice")}
  else if(t.id==="addMe"){ST.me.push({ind:"",cri:"",to:"1",gs:""});save();show("practice")}
  else if(t.dataset.del){const k=t.dataset.del;ST[k].splice(+t.dataset.j,1);if(!ST[k].length)ST[k].push(k==="inter"?{t:"",to:"E1"}:{ind:"",cri:"",to:"1",gs:""});save();show("practice")}
  else if(t.dataset.ver){ST.ver=t.dataset.ver;document.querySelectorAll("[data-ver]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ver===ST.ver));render()}
  else if(t.dataset.fmt){ST.fmt=t.dataset.fmt;document.querySelectorAll("[data-fmt]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.fmt===ST.fmt));render()}
  else if(t.id==="clear"){ST=JSON.parse(JSON.stringify(P_STATE));pesOpen=new Set();save();show("practice")}
  else if(t.id==="copy"){const txt=NOTE_TXT.out||"",msg=document.getElementById("copymsg");
   try{navigator.clipboard.writeText(txt).then(()=>msg.textContent="已複製。",()=>{selectOut();msg.textContent="無法自動複製，已選取文字，請手動複製。"})}catch(err){selectOut();msg.textContent="無法自動複製，已選取文字，請手動複製。"}}
 };
 document.querySelectorAll("details.pesd").forEach(d=>d.addEventListener("toggle",()=>{const i=+d.dataset.pi;if(d.open)pesOpen.add(i);else pesOpen.delete(i)}));
 render();
}
function selectOut(){const r=document.createRange();r.selectNodeContents(document.getElementById("out"));const s=getSelection();s.removeAllRanges();s.addRange(r)}

const NOTE_TXT={};
const HEADS=/^(A 營養評估|D 營養診斷|I 營養介入|M&E 營養監測與評值|S|O|A|P)$/;
const outHtml=t=>t.split("\n").map(l=>HEADS.test(l)?`<b>${esc(l)}</b>`:esc(l)).join("\n");
/* ---------- 來源 ---------- */
function vSources(){
 const cards=Object.entries(SRC).map(([id,s])=>`<div class="srccard" id="src-${id}"><div class="btnrow"><span class="srcid">${id}</span></div>
  <h4>${esc(s.t)}</h4><div class="meta">${esc(s.pub)}</div>
  ${s.url?`<div class="meta"><a href="${s.url}" target="_blank" rel="noopener">${esc(s.url)}</a>${s.url2?`<br><a href="${s.url2}" target="_blank" rel="noopener">${esc(s.url2)}</a>`:""}</div>`:""}</div>`).join("");
 return `<section class="view">
 <div><h2>參考資料</h2></div>
 <div style="display:grid;gap:12px">${cards}</div>
 </section>`}

/* ---------- 路由 ---------- */
const VIEWS={ncp:vNcp,assess:vAssess,pes:vPes,intervene:vInterv,monitor:vMonitor,practice:vPractice,sources:vSources};
function show(name,focusSrc){
 const app=document.getElementById("app");app.onclick=null;app.oninput=null;app.onchange=null;
 app.innerHTML=VIEWS[name]();
 document.querySelectorAll("#tabs a").forEach(a=>{if(a.getAttribute("href")==="#"+name)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
 if(name==="practice")bindPractice();
 if(name==="pes")bindTerms();
 if(name==="assess")bindATerms();
 if(focusSrc){const el=document.getElementById(focusSrc);if(el){el.classList.add("hl");el.scrollIntoView({block:"start"});setTimeout(()=>el.classList.remove("hl"),1800)}}
}
function route(){const h=(location.hash||"#ncp").slice(1);
 if(h.startsWith("src-")){show("sources",h);return}
 if(h==="write-a"){show("assess");const b=document.getElementById("write-a");if(b)b.scrollIntoView({block:"start"});return}
 if(h==="write-e"){show("pes");const b=document.getElementById("write-e");if(b)b.scrollIntoView({block:"start"});return}
 if(h==="aterms"){show("assess");const b=document.getElementById("atermsbox");if(b){b.open=true;b.scrollIntoView({block:"start"})}return}
 if(h==="terms"){show("pes");const b=document.getElementById("termsbox");if(b){b.open=true;b.scrollIntoView({block:"start"})}return}
 show(VIEWS[h]?h:"ncp");if(VIEWS[h])window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script>
